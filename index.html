<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>승훈스 고정비앱 V1</title>
<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101013" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="승훈스 고정비앱 V1">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root { --bg: #f2f4f6; --card: #fff; --ink: #191f28; --sub: #4e5968; --muted: #8b95a1; --line: #eceef1; --fill: #f2f4f6; --accent: #f26b0f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101013; --card: #1c1c21; --ink: #f2f3f5; --sub: #b0b6bf; --muted: #868b94; --line: #2a2b31; --fill: #26272d; --accent: #ff8133; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; padding: 0; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  .scr { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); transition: opacity .25s; z-index: 2; padding: 24px 24px calc(96px + env(safe-area-inset-bottom)); text-align: center; }
  .scr.off { opacity: 0; pointer-events: none; }
  .logo { width: 76px; height: 76px; border-radius: 20px; box-shadow: 0 6px 18px rgba(242,107,15,.25); }
  .scr h1 { margin: 16px 0 0; font-size: 19px; letter-spacing: -.03em; }
  .scr p { margin: 8px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.55; max-width: 300px; }
  .dots { display: flex; gap: 6px; margin-top: 18px; } .dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--muted); opacity: .4; animation: d 1s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes d { 50% { opacity: 1; } }
  .box { width: 100%; max-width: 340px; margin-top: 26px; }
  .acct { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 16px; padding: 14px 16px; text-align: left; }
  .acct .g { flex: none; width: 36px; height: 36px; border-radius: 18px; background: var(--fill); display: flex; align-items: center; justify-content: center; }
  .acct .t { min-width: 0; } .acct .t small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .acct .t span { display: block; font-size: 14.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn { display: block; width: 100%; height: 50px; margin-top: 12px; border-radius: 14px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 700; }
  .btn2 { display: block; width: 100%; height: 44px; margin-top: 6px; border-radius: 14px; color: var(--sub); font-size: 13.5px; font-weight: 600; }
  .note { font-size: 12.5px !important; text-align: left; background: var(--card); border-radius: 14px; padding: 12px 14px; margin: 12px 0 0 !important; max-width: none !important; color: var(--sub) !important; }
  .inst { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 5; max-width: 460px; margin: 0 auto; background: var(--card); border-radius: 18px; padding: 12px 12px 12px 14px; display: none; align-items: center; gap: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.14); text-align: left; }
  .inst.on { display: flex; }
  .inst img { width: 40px; height: 40px; border-radius: 11px; flex: none; }
  .inst .t { flex: 1; min-width: 0; font-size: 12.5px; color: var(--sub); line-height: 1.4; } .inst .t b { display: block; font-size: 13.5px; color: var(--ink); }
  .inst .go { flex: none; height: 36px; padding: 0 14px; border-radius: 11px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; }
  [hidden] { display: none !important; }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
</head>
<body>
<!-- 1) 불러오는 중 -->
<div class="scr" id="splash">
  <img class="logo" src="icons/icon-192.png" alt="">
  <h1>승훈스 고정비앱 V1</h1>
  <div class="dots"><i></i><i></i><i></i></div>
</div>

<!-- 2) 처음 켤 때: 어떤 구글 계정으로 쓸지 확인 -->
<div class="scr off" id="login">
  <img class="logo" src="icons/icon-192.png" alt="">
  <h1>구글 계정으로 시작하기</h1>
  <p>내 고정비 시트와 구글 캘린더는 이 계정에 저장돼요.</p>
  <div class="box" id="pickBox">
    <div class="acct">
      <div class="g"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg></div>
      <div class="t"><small>로그인된 구글 계정</small><span id="who">구글 계정</span></div>
    </div>
    <button class="btn" id="startBtn">이 계정으로 시작</button>
    <button class="btn2" id="otherBtn">다른 구글 계정으로</button>
  </div>
  <div class="box" id="otherBox" hidden>
    <p class="note">이 브라우저의 구글 로그인을 끊고, 쓰고 싶은 계정으로 다시 로그인해요.<br>① 아래 [로그아웃 열기] → 로그아웃<br>② 앱으로 돌아와서 [다시 열기] → 원하는 계정으로 로그인</p>
    <button class="btn" id="logoutBtn">로그아웃 열기</button>
    <button class="btn2" id="reloadBtn1">다시 열기</button>
    <button class="btn2" id="backBtn">취소</button>
  </div>
</div>

<!-- 3) 아직 구글 로그인이 안 됐을 때 -->
<div class="scr off" id="signin">
  <img class="logo" src="icons/icon-192.png" alt="">
  <h1>구글 계정으로 로그인</h1>
  <p>처음 한 번은 구글 로그인과 권한 허용이 필요해요. 로그인 창에서 허용하고 이 앱으로 돌아와 [다시 열기]를 눌러주세요.</p>
  <div class="box">
    <button class="btn" id="signinBtn">구글 계정으로 로그인</button>
    <button class="btn2" id="reloadBtn2">다시 열기</button>
  </div>
</div>

<!-- 브라우저로 열었을 때만: 앱으로 설치 -->
<div class="inst" id="inst">
  <img src="icons/icon-192.png" alt="">
  <div class="t" id="instText"><b>앱으로 설치하기</b>설치하면 브라우저 표시 없이 앱으로 열려요</div>
  <button class="go" id="instBtn">설치</button>
</div>
<script>
  // 실제 앱(구글 Apps Script 웹 앱) 주소. 이 페이지는 그 앱을 감싸서 휴대폰에 '진짜 앱'처럼 설치되게 해요.
  var APP = 'https://script.google.com/macros/s/AKfycbww5i92oly5x6-JFIsOl1kBH_gUCIlOTvaZ-TVmWzBqaNiB0he55QtpTIEyfDVrb23gBA/exec';
  var $ = function (id) { return document.getElementById(id); };
  var ready = false, email = '';
  function show(id) { ['splash', 'login', 'signin'].forEach(function (k) { $(k).classList.toggle('off', k !== id); }); syncInstall(); }
  function hideAll() { ['splash', 'login', 'signin'].forEach(function (k) { $(k).classList.add('off'); }); syncInstall(); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  var f = document.createElement('iframe');
  f.src = APP + '?embed=1';
  f.allow = 'clipboard-write';
  f.title = '승훈스 고정비앱 V1';
  document.body.insertBefore(f, document.body.firstChild);

  window.addEventListener('message', function (e) {
    var d = e.data, isReady = d === 'fc-ready' || (d && d.fc === 'ready');
    if (!isReady || ready) return;
    ready = true;
    email = (d && d.email) || '';
    var started = store('fc_started');
    // 처음 켤 때(또는 계정이 바뀌었을 때)는 어떤 계정으로 쓸지 먼저 보여줌
    if (!started || (email && started !== email && started !== '1')) {
      $('who').textContent = email || '이 기기에 로그인된 구글 계정';
      show('login');
    } else hideAll();
  });
  $('startBtn').onclick = function () { store('fc_started', email || '1'); hideAll(); };
  $('otherBtn').onclick = function () { $('pickBox').hidden = true; $('otherBox').hidden = false; };
  $('backBtn').onclick = function () { $('pickBox').hidden = false; $('otherBox').hidden = true; };
  $('logoutBtn').onclick = function () { window.open('https://accounts.google.com/Logout', '_blank'); };
  $('signinBtn').onclick = function () { window.open(APP, '_blank'); };
  $('reloadBtn1').onclick = $('reloadBtn2').onclick = function () { location.reload(); };
  // 구글 로그인이 안 돼 있으면 구글이 앱 안에 로그인 창을 못 띄워서(보안 정책) 바깥 창으로 로그인하게 안내
  setTimeout(function () { if (!ready) show('signin'); }, 12000);

  // 설치 안내: 브라우저로 열었을 때만, 시작 화면에서만
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var installEvt = null, instHidden = false;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installEvt = e; syncInstall(); });
  window.addEventListener('appinstalled', function () { instHidden = true; syncInstall(); });
  function syncInstall() {
    var onStart = !$('login').classList.contains('off') || !$('signin').classList.contains('off') || !$('splash').classList.contains('off');
    $('inst').classList.toggle('on', !standalone && !instHidden && onStart);
  }
  $('instBtn').onclick = function () {
    if (installEvt) {
      installEvt.prompt();
      installEvt.userChoice.then(function (c) { if (c.outcome === 'accepted') { instHidden = true; syncInstall(); } installEvt = null; });
      return;
    }
    var samsung = /SamsungBrowser/i.test(navigator.userAgent);
    $('instText').innerHTML = '<b>이렇게 설치해요</b>' + (samsung
      ? '아래 메뉴(≡) → <b style="display:inline">현재 페이지 추가</b> → 홈 화면'
      : '오른쪽 위 메뉴(⋮) → <b style="display:inline">앱 설치</b> 또는 홈 화면에 추가 → 설치');
    $('instBtn').hidden = true;
  };
  syncInstall();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
