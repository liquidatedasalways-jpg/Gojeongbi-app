<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>
/* 다른 사이트가 이 앱을 자기 화면 안에 끼워 넣으면(눌러야 할 곳을 가려서 속이는 수법) 화면을 숨기고 앱도 시작하지 않음.
 * GitHub Pages는 서버 응답 머리글을 못 바꿔서 여기서 막음. */
if (window.top !== window.self) {
  window.FC_FRAMED = true;
  document.documentElement.style.setProperty('display', 'none', 'important');
  try { window.top.location = window.self.location.href; } catch (e) {}
}
</script>
<script>
/* 설정에서 고른 화면 색(이 기기에만 저장)을 화면이 그려지기 전에 입힘. 없으면 기본(네이비). */
try { var fcTone = localStorage.getItem('fc_tone'); if (fcTone === 'blue' || fcTone === 'violet') document.documentElement.setAttribute('data-tone', fcTone); } catch (e) {}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
/* ===== 디자인 규칙 =====
 * 색 뜻: 강조색(기본 네이비) = 누를 것·오늘 / 초록 = 냈음 / 빨강 = 지남. 글자에 쓰는 색(-text)은 바탕과 대비 4.5:1 이상.
 * 강조색은 설정에서 네이비·블루·바이올렛 중 고름(html의 data-tone). 색 묶음마다 밝은·다크 값을 같은 변수로 둘 다 적어야 함.
 * 글자 크기 7단계: 11 · 12 · 13 · 15 · 17 · 20 · 28. 누르는 곳은 44px 이상.
 * 모서리: 아래 창 24 / 카드 20 / 버튼·입력 14 / 알약. */
:root {
  --bg: #f2f4f6; --card: #ffffff; --child: #f8f9fa;
  --ink: #191f28; --ink2: #333d4b; --sub: #4e5968; --muted: #626d7b; --ring: #8b95a1; --faint: #b0b8c1;
  --line: #eceef1; --fill: #f2f4f6; --fill2: #e5e8eb; --segon: #ffffff;
  --accent: #1c2b6e; --accent-ink: #ffffff; --accent-text: #2b44b0; --sel: #eceffa;
  --ok: #049e63; --on-ok: #ffffff; --ok-text: #067d4f; --ok-soft: #e7f6ef;
  --red: #f04452; --red-text: #d02937; --red-soft: #feeef0; --danger: #d02937; --on-danger: #ffffff;
  --sun: #d02937; --sat: var(--ink); --sat-h: var(--muted); --grape: #8b4ad8;
  --tone-navy: #1c2b6e; --tone-blue: #1f63f0; --tone-violet: #6a3de8;
  --toast-act: #b3c0ff;   /* 알림 띠(밝은·다크 모두 어두운 바탕) 안의 버튼 글자: 강조색의 밝은 값 */
  --bar: rgba(255,255,255,.94); --backdrop: rgba(0,0,0,.42); --shadow: none; --fab: 0 4px 14px rgba(28,43,110,.32);
  --r-card: 20px; --r-ctl: 14px;
  /* 분류 9가지 색 (아이콘 바탕) */
  --c-home: #3b82f6; --c-util: #f2a20c; --c-tel: #e85f9e; --c-sub: #8b5cf6; --c-ins: #10b3a3; --c-loan: #5567d8; --c-save: #58b530; --c-edu: #f0685f; --c-etc: #8b95a1; --c-ink: #ffffff;
}
/* 강조색이 파랑 계열(네이비·블루)이면 토요일은 평일과 같은 색, 바이올렛이면 토요일 파랑을 살리고 '마지막 결제' 표시를 자주색으로. */
:root[data-tone="blue"] { --toast-act: #8db6ff; --accent: #1f63f0; --accent-ink: #ffffff; --accent-text: #1a55d1; --sel: #e9f1ff; --fab: 0 4px 14px rgba(31,99,240,.32); }
:root[data-tone="violet"] { --toast-act: #bda7ff; --accent: #6a3de8; --accent-ink: #ffffff; --accent-text: #5a2fd0; --sel: #f1ecff; --fab: 0 4px 14px rgba(106,61,232,.32); --sat: #1b64da; --sat-h: #1b64da; --grape: #b0308f; }
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101013; --card: #1c1c21; --child: #222227;
    --ink: #f2f3f5; --ink2: #dadde2; --sub: #b4bac3; --muted: #969ca6; --ring: #7a7f89; --faint: #4a4d55;
    --line: #2a2b31; --fill: #26272d; --fill2: #33343b; --segon: #3d3e46;
    --accent: #93a5ff; --accent-ink: #0b1230; --accent-text: #b3c0ff; --sel: #242b4d;
    --ok: #1fc47d; --on-ok: #04261a; --ok-text: #45d795; --ok-soft: #14332a;
    --red: #ff5c6c; --red-text: #ff7d8a; --red-soft: #3d1c20; --danger: #ff5c6c; --on-danger: #2a0508;
    --sun: #ff7d8a; --grape: #b98af5;
    --tone-navy: #93a5ff; --tone-blue: #5c96ff; --tone-violet: #a78bfa;
    --bar: rgba(22,22,26,.94); --backdrop: rgba(0,0,0,.6); --fab: 0 4px 14px rgba(0,0,0,.4);
    --c-home: #4f8ff7; --c-util: #f5ab1f; --c-tel: #ee6fa9; --c-sub: #9a70f8; --c-ins: #1fc0b0; --c-loan: #6b7be6; --c-save: #66c23c; --c-edu: #f4776e; --c-etc: #7f8894;
  }
  :root[data-tone="blue"] { --accent: #5c96ff; --accent-ink: #04122e; --accent-text: #8db6ff; --sel: #172a4a; --fab: 0 4px 14px rgba(0,0,0,.4); }
  :root[data-tone="violet"] { --accent: #a78bfa; --accent-ink: #170a3d; --accent-text: #bda7ff; --sel: #2b2350; --fab: 0 4px 14px rgba(0,0,0,.4); --sat: #74abff; --sat-h: #74abff; --grape: #f08ad0; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
body {
  font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  font-size: 15px; font-weight: 500; line-height: 1.4; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; min-height: 100vh;
  font-feature-settings: "tnum"; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%;
  word-break: keep-all; overflow-wrap: anywhere;
}
input, textarea, select { -webkit-user-select: text; user-select: text; font: inherit; color: inherit; letter-spacing: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; letter-spacing: inherit; }
svg { display: block; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .spin, .sync .sp, .loadbar i { animation-duration: .8s !important; animation-iteration-count: infinite !important; }
}

/* 위 막대 */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); padding-top: env(safe-area-inset-top); }
.top-in { max-width: 600px; margin: 0 auto; height: 52px; display: flex; align-items: center; gap: 2px; padding: 0 4px 0 20px; }
.top h1 { flex: 1; min-width: 0; margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top h1 small { margin-left: 6px; font-size: 13px; font-weight: 600; letter-spacing: -.01em; color: var(--muted); }
/* 달력 탭에서만: 위 막대가 곧 달 이름과 달 넘기기 */
.calnav { flex: none; display: none; align-items: center; }
body.on-cal .calnav { display: flex; }
.calnav .today-btn { flex: none; height: 44px; padding: 0 4px; display: flex; align-items: center; }
.calnav .today-btn[hidden] { display: none; }
.calnav .today-btn span { height: 32px; padding: 0 12px; border-radius: 16px; background: var(--card); font-size: 13px; font-weight: 600; color: var(--sub); display: flex; align-items: center; }
.calnav .nav { flex: none; width: 40px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: var(--sub); }
.calnav .nav[disabled] { opacity: .3; }
.calnav .nav svg { width: 18px; height: 18px; }
.sync { font-size: 12px; font-weight: 600; color: var(--muted); display: none; align-items: center; gap: 5px; height: 44px; padding: 0 6px; white-space: nowrap; }
.sync.on { display: inline-flex; }
.sync.err { color: var(--red-text); }
.sync .sp { width: 10px; height: 10px; border: 1.6px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
.ibtn { flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 22px; color: var(--sub); }
.ibtn svg { width: 22px; height: 22px; }
.loadbar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; overflow: hidden; opacity: 0; transition: opacity .2s; }
.loadbar.on { opacity: 1; }
.loadbar i { position: absolute; top: 0; bottom: 0; width: 30%; background: var(--accent); border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { left: -30%; } 100% { left: 100%; } }
@keyframes spin { to { transform: rotate(360deg); } }

.tab { display: none; max-width: 600px; margin: 0 auto; padding: 0 12px calc(74px + env(safe-area-inset-bottom)); }
.tab.on { display: block; }

/* 첫 화면 맨 위: 결제일 없는 항목 알림 한 줄 */
.ndb { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; margin: 0 0 8px; padding: 0 4px 0 14px; border-radius: var(--r-ctl); background: var(--card); text-align: left; }
.ndb .dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.ndb b { flex: none; font-size: 13px; font-weight: 700; white-space: nowrap; }
.ndb .nms { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ndb .go { flex: none; height: 44px; padding: 0 10px; display: flex; align-items: center; gap: 1px; font-size: 13px; font-weight: 700; color: var(--accent-text); white-space: nowrap; }
.ndb .go svg { width: 14px; height: 14px; }

/* 처음 쓰는 사람: 자주 쓰는 항목 바로 넣기 */
.welcome { background: var(--card); border-radius: var(--r-card); padding: 20px; margin-bottom: 8px; }
.welcome h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.04em; line-height: 1.35; }
.welcome p { margin: 6px 0 16px; font-size: 13px; color: var(--sub); }
.welcome .btn { width: 100%; }

/* 달력 */
/* 이 달 한 장: 위에 요약(더 낼 돈), 아래에 달력 */
.mo { background: var(--card); border-radius: var(--r-card); margin-bottom: 4px; overflow: hidden; }
.cal { padding: 10px 10px 4px; touch-action: pan-y; }
.cg { display: grid; grid-template-columns: repeat(7, 1fr); }
.wd { font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; padding: 0 0 6px; }
.wd.sun { color: var(--sun); } .wd.sat { color: var(--sat-h); }
.cd { height: 44px; display: flex; flex-direction: column; align-items: center; padding-top: 2px; border-top: 1px solid var(--line); position: relative; }
.cd .n { width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 50%; font-size: 13px; font-weight: 600; letter-spacing: -.02em; }
.cd.sun .n, .cd.hol .n { color: var(--sun); }
.cd.sat .n { color: var(--sat); }
.cd.past .n { color: var(--muted); font-weight: 500; }
.cd.today .n { background: var(--accent); color: var(--accent-ink); font-weight: 800; }
.cd.sel::before { content: ""; position: absolute; inset: 2px 3px; border-radius: 12px; background: var(--sel); z-index: 0; }
.cd > * { position: relative; z-index: 1; }
.cd .a { display: flex; align-items: center; gap: 1px; font-size: 11px; font-weight: 600; line-height: 14px; margin-top: 0; color: var(--ink2); letter-spacing: -.03em; white-space: nowrap; }
.cd .a.paid { color: var(--muted); font-weight: 500; }
.cd .a.paid svg { width: 8px; height: 8px; color: var(--ok); }
.cd .a.over { color: var(--red-text); font-weight: 700; }
.cd.has { cursor: pointer; }

/* 맨 위 요약: 이 달에 더 낼 돈(큰 숫자) + 낸 만큼 차는 막대 */
.hero { padding: 14px 20px 4px; }
.hero:empty { display: none; }
.hero .hr { display: flex; align-items: baseline; gap: 10px; }
.hero .lb { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; color: var(--sub); white-space: nowrap; }
.hero .tot { flex: none; font-size: 13px; color: var(--muted); white-space: nowrap; }
/* 큰 숫자와 '얼마 냈어요'는 한 줄. 좁은 화면·큰 금액이라 안 들어가면 숫자를 줄이지 않고 '냈어요'만 아랫줄로 내림 */
.hero .hr + .hr { flex-wrap: wrap; }
.hero .num { flex: 0 1 auto; max-width: 100%; min-width: 0; font-size: 28px; font-weight: 800; letter-spacing: -.04em; line-height: 1.2; white-space: nowrap; overflow: hidden; }
.hero .num small { font-size: .715em; font-weight: 700; margin-left: 1px; }
.hero .pd { flex: none; margin-left: auto; font-size: 13px; color: var(--sub); white-space: nowrap; }
.hero .pd b { font-weight: 700; color: var(--ok-text); }
.hero .bar { height: 6px; border-radius: 3px; background: var(--fill2); margin: 8px 0 0; overflow: hidden; }
.hero .bar i { display: block; height: 100%; border-radius: 3px; background: var(--ok); transition: width .3s ease; }

/* 묶음 제목 (첫 화면) */
.sec { display: flex; align-items: center; gap: 6px; padding: 14px 8px 6px; }
.sec h3 { flex: none; margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.03em; white-space: nowrap; }
.sec .c { flex: 1; min-width: 0; font-size: 13px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sec .act { flex: none; margin: -14px -8px -14px 0; height: 44px; padding: 0 8px; display: flex; align-items: center; font-size: 13px; font-weight: 700; color: var(--accent-text); white-space: nowrap; }

/* 결제 줄 (첫 화면) */
.grp { background: var(--card); border-radius: var(--r-card); overflow: hidden; }
.row { position: relative; display: flex; align-items: stretch; min-height: 54px; background: var(--card); }
.grp > * + *::after { content: ""; position: absolute; left: 52px; right: 18px; top: 0; height: 1px; background: var(--line); }
.chk { flex: none; width: 52px; display: flex; align-items: center; justify-content: center; }
.chk i { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--ring); display: flex; align-items: center; justify-content: center; color: transparent; transition: background .15s, border-color .15s; }
.chk i svg { width: 13px; height: 13px; }
.chk.static { cursor: default; }
.checked .chk i { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
.chk.pop i { animation: pop .34s cubic-bezier(.3,1.5,.5,1); }
@keyframes pop { 0% { transform: scale(.72); } 55% { transform: scale(1.16); } 100% { transform: scale(1); } }
.rb { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 7px 18px 7px 0; }
.rl { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.nm { font-size: 15px; font-weight: 600; letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t2 { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rr { flex: none; display: flex; flex-direction: column; align-items: flex-end; }
.am { font-size: 15px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
.am.none { font-size: 13px; font-weight: 500; color: var(--muted); }
.st { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.over { color: var(--red-text); font-weight: 600; }
.soon { color: var(--accent-text); font-weight: 600; }
/* 오늘 낼 것만 채운 알약(달력의 오늘 동그라미와 같은 색). 내일부터는 회색 글자 그대로. 줄 높이가 안 바뀌게 글자 줄 높이와 같게 */
.st.today { padding: 0 7px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; line-height: calc(12px * 1.4); }
.lastp { color: var(--grape); }
/* 이름 옆 아주 작은 표시. NEW: 첫 결제가 이번 달이거나 아직 안 온 항목, LAST: 이번이 마지막 결제 */
.nl { display: flex; align-items: center; gap: 5px; min-width: 0; }
.nl .nm { min-width: 0; }
.bdg { flex: none; display: inline-flex; align-items: center; height: 15px; padding: 0 4px; border-radius: 4px; font-size: 10px; font-weight: 700; line-height: 1; letter-spacing: .04em; background: var(--sel); color: var(--accent-text); }
.bdg.last { background: var(--fill); background: color-mix(in srgb, var(--grape) 14%, transparent); color: var(--grape); }
.checked .bdg, .row.muted .bdg { opacity: .55; }
.checked .nm, .checked .am, .checked .av, .checked .dv, .row.muted .nm, .row.muted .av, .row.muted .dv { color: var(--muted); font-weight: 500; }
.row.child { background: var(--child); }
.row.pending .chk i { opacity: .8; }
.row.flash { animation: flash 1.3s ease-out; }
@keyframes flash { 0%, 30% { background: var(--sel); } }
.row.gone { opacity: 0; transform: translateX(30px); transition: opacity .2s, transform .2s; }
.row.enter { animation: enter .3s ease-out; }
@keyframes enter { from { opacity: 0; } }
.empty { padding: 22px 16px; font-size: 13px; color: var(--muted); text-align: center; }
/* 결제 완료: 한 줄로 접어 둠 */
.fold { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; margin-top: 8px; padding: 0 14px; background: var(--card); border-radius: var(--r-card); font-size: 15px; font-weight: 600; }
.fold .ci { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--ok); color: var(--on-ok); display: flex; align-items: center; justify-content: center; }
.fold .ci svg { width: 13px; height: 13px; }
.fold .r { margin-left: auto; display: flex; align-items: center; gap: 2px; font-size: 13px; font-weight: 500; color: var(--sub); white-space: nowrap; }
.fold .r svg { width: 16px; height: 16px; transition: transform .2s; }
.fold.open { border-radius: var(--r-card) var(--r-card) 0 0; }
.fold.open .r svg { transform: rotate(180deg); }
.fold.open + .grp { border-radius: 0 0 var(--r-card) var(--r-card); border-top: 1px solid var(--line); }

/* 목록 탭 머리: 몇 개·한 달 평균, 분류 알약 */
.bar2 { display: flex; align-items: center; min-height: 28px; padding: 0 8px 4px; font-size: 13px; color: var(--sub); }
.bar2 #countTxt { flex: 1; min-width: 0; }
.bar2 b { font-weight: 700; color: var(--ink); white-space: nowrap; }
.fchips { display: flex; gap: 6px; margin: -4px -12px 0; padding: 0 12px 4px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.fchips::-webkit-scrollbar { display: none; }
.fchips:empty { display: none; }
/* 누르는 곳은 44px, 보이는 알약은 그 안에 36px (::before) */
.fc { position: relative; z-index: 0; flex: none; height: 44px; padding: 0 13px; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--sub); white-space: nowrap; }
.fc::before { content: ""; position: absolute; inset: 4px 0; z-index: -1; border-radius: 18px; background: var(--card); }
.fc small { font-size: 12px; font-weight: 600; color: var(--muted); }
.fc.on { color: var(--card); font-weight: 700; }
.fc.on::before { background: var(--ink); }
.fc.on small { color: inherit; opacity: .7; }

.skel { height: 58px; background: var(--card); border-radius: var(--r-card); margin-bottom: 8px; opacity: .7; }
.fatal { padding: 30px 16px; text-align: center; color: var(--sub); font-size: 13px; }
.fatal b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
.fatal .btn { flex: none; }

/* 아래 탭 */

/* 아래에서 올라오는 창: 흰 바탕에 줄로만 나눔. 맨 아래 큰 버튼은 창 아래에 붙어 있음 */

.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 600px; margin: 0 auto; background: var(--card); border-radius: 24px 24px 0 0; max-height: 92vh; max-height: 92dvh; display: flex; flex-direction: column; transform: translateY(105%); visibility: hidden; transition: transform .3s cubic-bezier(.2,.85,.25,1), visibility 0s .3s; }

/* 키가 작은 화면에선 창을 조금 더 높이까지 (입력 칸이 한 번에 보이게) */

.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--fill2); margin: 8px auto 0; flex: none; }

.sb { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px 20px calc(20px + env(safe-area-inset-bottom)); }
.cta { flex: none; display: none; padding: 10px 16px calc(16px + env(safe-area-inset-bottom)); background: var(--card); box-shadow: 0 -1px 0 var(--line); border-radius: 0; }

.cta .btn { width: 100%; }
.btns { display: flex; gap: 8px; }
.btn { flex: 1; min-width: 0; height: 54px; border-radius: var(--r-ctl); background: var(--fill); color: var(--ink2); font-size: 17px; font-weight: 700; text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.side { flex: 0 0 96px; }
.btn.danger { background: var(--danger); color: var(--on-danger); }
.btn[disabled] { opacity: .6; }
.btn svg { flex: none; width: 18px; height: 18px; }
/* 항목 상세 */
.dnum { font-size: 28px; font-weight: 800; letter-spacing: -.04em; line-height: 1.25; }
.dnum small { font-size: 20px; font-weight: 700; margin-left: 1px; }
.dnum.none { font-size: 20px; font-weight: 700; color: var(--muted); }
.dmeta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; margin: 4px 0 16px; font-size: 13px; color: var(--sub); }
.pill { flex: none; height: 24px; padding: 0 8px; border-radius: 12px; display: inline-flex; align-items: center; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--fill); color: var(--sub); }
.pill.red { background: var(--red-soft); color: var(--red-text); }
.pill.soon { background: var(--sel); color: var(--accent-text); }
.pill.today { background: var(--accent); color: var(--accent-ink); }
.pill.ok { background: var(--ok-soft); color: var(--ok-text); }
.kvs { margin-top: 14px; border-top: 1px solid var(--line); }

/* 줄 목록 (설정, 결제 수단) */
.grp > .kv + .kv::after, .grp > .f + .f::after, .grp > .li + .li::after, .grp > .qd + .qd::after { left: 18px; right: 18px; }
.li { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 0 18px; font-size: 15px; font-weight: 500; position: relative; text-align: left; text-decoration: none; color: var(--ink); }

.li.addl { color: var(--accent-text); font-weight: 600; }
.li > .tx, .li > .tx:first-child { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 8px 0; white-space: normal; word-break: keep-all; }

.legalrow { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 4px; padding-top: 8px; border-top: 1px solid var(--line); }
.legalrow a { min-height: 44px; padding: 0 10px; display: inline-flex; align-items: center; font-size: 13px; font-weight: 600; color: var(--sub); text-decoration: none; }
.switch { margin-left: auto; width: 48px; height: 28px; border-radius: 14px; background: var(--faint); position: relative; transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }

.set-acc { display: flex; align-items: center; gap: 12px; padding: 4px 0 8px; }
.set-acc .av { flex: none; width: 44px; height: 44px; border-radius: 22px; background: var(--sel); color: var(--accent-text); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; }

.tones { display: flex; gap: 8px; padding: 8px 0 10px; }

.tones button[aria-checked="true"] { background: var(--sel); color: var(--accent-text); font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--accent); }
.tones button[aria-checked="true"] i svg { opacity: 1; }
.glabel { font-size: 13px; font-weight: 700; color: var(--sub); padding: 14px 0 2px; letter-spacing: -.02em; }
.tip { font-size: 13px; color: var(--muted); padding: 2px 0 12px; line-height: 1.5; }
.tip.err { color: var(--red-text); font-weight: 600; }

.tipline { font-size: 13px; color: var(--sub); background: var(--fill); border-radius: var(--r-ctl); padding: 10px 14px; margin: -6px 0 16px; }
.linkbox { margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--fill); font-size: 12px; word-break: break-all; -webkit-user-select: all; user-select: all; }
.sheet .grp { background: none; border-radius: 0; overflow: visible; }
.sheet .grp > * + *::after, .sheet .grp > .kv + .kv::after, .sheet .grp > .f + .f::after, .sheet .grp > .li + .li::after, .sheet .grp > .qd + .qd::after { left: 0; right: 0; }

.fld { padding: 4px 0 8px; position: relative; }

.lrow { display: flex; align-items: center; }
.lrow > label { flex: 1; }
.lnk { flex: none; height: 44px; min-width: 44px; margin: -14px -6px -10px 0; padding: 0 6px; display: flex; align-items: center; justify-content: flex-end; font-size: 13px; font-weight: 600; color: var(--sub); }
.inp { display: flex; align-items: baseline; gap: 6px; min-height: 44px; padding: 2px 0 6px; border-bottom: 2px solid var(--fill2); transition: border-color .15s; cursor: text; }
.inp:focus-within { border-color: var(--accent); }
.inp input { flex: 1; min-width: 0; width: 100%; border: 0; border-radius: 0; background: none; outline: none; padding: 0; font-size: 20px; font-weight: 700; letter-spacing: -.03em; line-height: 1.5; -webkit-appearance: none; appearance: none; }
.inp input::placeholder { color: var(--muted); font-weight: 500; }
.inp.big .grow { position: relative; flex: 0 1 auto; min-width: 22px; max-width: calc(100% - 28px); overflow: hidden; font-size: 28px; font-weight: 800; letter-spacing: -.04em; line-height: 1.25; white-space: nowrap; }
.inp.big .mir { display: block; visibility: hidden; white-space: pre; font-style: normal; padding-right: 3px; }
.inp.big input { position: absolute; left: 0; top: 0; width: 100%; height: 100%; font-size: 28px; font-weight: 800; letter-spacing: -.04em; line-height: 1.25; }
.inp.big input::placeholder { font-weight: 800; }
.inp .u { flex: none; font-size: 17px; font-weight: 600; color: var(--sub); }
.hint { font-size: 13px; color: var(--muted); padding-top: 6px; }
.hint:empty { display: none; }
.seg { display: flex; flex: none; background: var(--fill); border-radius: var(--r-ctl); padding: 3px; }
.seg button { flex: 1; height: 44px; padding: 0 12px; border-radius: 11px; font-size: 13px; font-weight: 600; color: var(--sub); text-align: center; white-space: nowrap; }

.selb { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 48px; padding: 0 12px 0 16px; border-radius: var(--r-ctl); background: var(--fill); font-size: 15px; font-weight: 600; text-align: left; }
.selb span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.selb svg { flex: none; width: 18px; height: 18px; color: var(--muted); }
.selb.empty { color: var(--muted); font-weight: 500; }
.fld select { width: 100%; height: 48px; border: 0; border-radius: var(--r-ctl); background-color: var(--fill); padding: 0 32px 0 16px; font-size: 15px; font-weight: 600; outline: none; -webkit-appearance: none; appearance: none; }
.fld > input[type="text"] { width: 100%; height: 48px; border: 0; border-radius: var(--r-ctl); background: var(--fill); padding: 0 16px; font-size: 15px; font-weight: 600; outline: none; }
.fld.badf > label, .fld.badf > .lrow > label, .f.badf > label { color: var(--red-text); }
.fld.badf .inp { border-color: var(--red); }
.fld.badf .selb { box-shadow: inset 0 0 0 1.5px var(--red); }
/* '더 적기' 안: 안 적어도 되는 칸은 이름 옆에 작게 */
.more { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 48px; margin-top: 0; padding: 0; border-top: 1px solid var(--line); text-align: left; }
.more .l { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; }
.more .l b { flex: none; font-size: 15px; font-weight: 600; }
.more .l small { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.more svg { flex: none; width: 20px; height: 20px; color: var(--muted); transition: transform .2s; }
.more.open svg { transform: rotate(180deg); }
.morebox { display: none; border-top: 1px solid var(--line); }
.morebox.on { display: block; }
.morebox > .f + .f::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--line); }
.f { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 4px 18px; position: relative; }

.f select { padding-right: 16px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 7px) 50%, calc(100% - 2px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }

/* 날짜 고르기 · 결제일 숫자판 */

.dp { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; max-width: 600px; margin: 0 auto; background: var(--card); border-radius: 24px 24px 0 0; padding: 8px 6px calc(16px + env(safe-area-inset-bottom)); transform: translateY(105%); visibility: hidden; transition: transform .28s cubic-bezier(.2,.85,.25,1), visibility 0s .28s; }

.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 60; transform: translate(-50%, 12px); width: calc(100% - 24px); max-width: 560px; min-height: 52px; background: rgba(36,38,44,.96); color: #fff; border-radius: 16px; padding: 4px 6px 4px 18px; font-size: 13px; line-height: 1.45; display: flex; align-items: center; gap: 6px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s; white-space: pre-line; box-shadow: 0 8px 24px rgba(0,0,0,.18); }

/* 업데이트 알림 띠: 화면 위에서 살짝 내려옴. 앱 새 버전(모두) / 서버 새 버전(앱 주인에게만). 닫으면 같은 버전은 하루 동안 안 뜸 */
.upb { position: fixed; left: 50%; top: calc(8px + env(safe-area-inset-top)); z-index: 30; width: calc(100% - 24px); max-width: 560px; min-height: 52px; display: flex; align-items: center; padding: 4px 0 4px 18px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 24px rgba(0,0,0,.2); font-size: 15px; font-weight: 700; line-height: 1.3; transform: translate(-50%, calc(-100% - 16px - env(safe-area-inset-top))); visibility: hidden; transition: transform .36s cubic-bezier(.2,.8,.2,1), visibility 0s .36s; }

  var silentFailed = !!(back && back.error && mode === 'none');
  var bye = null; try { bye = sessionStorage.getItem('fc_bye'); sessionStorage.removeItem('fc_bye'); } catch (e) {}

  var waiting = [], fetchingEmail = null;
  /** 지금 로그인 표의 주인으로 확인된 이메일 (확인 전이면 '') */
  function email() { var x = get(); return x.chk ? '' : (x.email || ''); }
  /** 로그인 표가 누구 것인지 구글에 물어봄. 앞 계정과 다르면 이 기기에 남은 앞 계정 것을 지움. */
  function loadEmail() {
    if (fetchingEmail) return fetchingEmail;
    var tok = get().token;
    fetchingEmail = fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + tok } })
      .then(function (r) { return r.ok ? r.json().catch(function () { return {}; }) : {}; }, function () { return null; })
      .then(function (u) {
        var x = get();
        if (u === null || x.token !== tok) { fetchingEmail = null; return email(); }   // 연결이 안 됨: 다음에 다시 물어봄
        var was = String(x.email || '').toLowerCase(), now = String((u && u.email) || '').toLowerCase();
        // 방금 로그인한 경우: 같은 계정으로 확인될 때만 남은 것을 그대로 씀. 조용히 새 표를 받은 경우: 다른 계정으로 확인되면 지움
        var other = x.chk ? (!now || was !== now) : (!!now && !!was && was !== now);
        var swapped = other && !x.chk;
        if (other) { forget(); delete x.srv; }
        if (now) x.email = u.email; else if (x.chk) delete x.email;
        delete x.chk;
        put(x);
        if (swapped) { location.reload(); return new Promise(function () {}); }   // 앞 계정 화면이 이미 떠 있을 수 있어 새로 엶
        return x.email || '';
      });
    return fetchingEmail;
  }

  /** 쓸 수 있는 로그인 표를 돌려줌. 없으면 구글에서 조용히 새로 받아오거나(화면 깜빡임 정도), 로그인 화면을 보여줌. */
  function ensure() {
    var x = get();
    if (lacking(x)) { showLogin(); return new Promise(function (res) { waiting.push(res); }); }   // 권한이 덜 허용된 표: 조용히 새로 받아도 똑같아서 다시 허용받게 함
    if (valid(x)) {
      if (!x.chk) return Promise.resolve(x.token);
      // 방금 로그인해서 받은 표: 누구 것인지 확인한 뒤에 서버를 부름
      return loadEmail().then(function () {
        var y = get();
        if (y.chk) throw new Error('인터넷 연결을 확인해주세요.');
        return y.token;
      });
    }
    if (x.email && !x.chk && !silentFailed) { go('none', x.email); return new Promise(function () {}); }
    showLogin();
    return new Promise(function (res) { waiting.push(res); });
  }

  function rawErr(d) {
    var e = d && d.error;
    if (!e) return '';
    var det = e.details && e.details[0];
    return String((det && det.errorMessage) || e.message || e.status || '');
  }
  var NOT_OWNER = /permission to access the requested document|요청한 문서.*권한|문서에 액세스할 권한/i;
  /** 구글이 영어로 주는 오류를 알아듣게 바꿈. 처음 보는 건 원문을 괄호에. */
  var ASK = C.contact ? '문의: ' + C.contact : '앱 만든 사람에게 알려주세요.';
  function errText(d, status) {
    var m = rawErr(d);
    if (!m) return '연결이 안 됐어요. 다시 해주세요. (' + status + ')';
    if (/disabled|not been used/i.test(m)) return 'Apps Script API가 꺼져 있어요. ' + ASK;
    if (status === 404 || /not found|Requested entity was not found/i.test(m) && !/function/i.test(m)) return '앱 서버를 못 찾았어요. ' + ASK;
    if (/Script function not found/i.test(m)) return '앱 서버가 옛 버전이에요. ' + ASK;
    if (NOT_OWNER.test(m)) return '이 계정으로는 아직 쓸 수 없어요. ' + ASK;
    if (/caller does not have permission|PERMISSION_DENIED/i.test(m)) return '앱 서버에 들어갈 권한이 없어요. ' + ASK;
    if (/insufficient authentication scopes|SCOPE_INSUFFICIENT|Authorization is required/i.test(m)) return '권한 허용이 덜 됐어요. 메뉴에서 로그아웃 후 다시 로그인해서 모두 허용해주세요.';
    if (/too many times|quota|Rate Limit|RESOURCE_EXHAUSTED/i.test(m)) return '구글 사용 한도에 잠깐 걸렸어요. 1분쯤 뒤에 다시 해주세요.';
    if (/maximum execution time|timed out|DEADLINE/i.test(m)) return '시간이 너무 오래 걸렸어요. 다시 해주세요.';
    if (/Service (error|unavailable)|internal error|UNAVAILABLE|backendError/i.test(m)) return '구글 쪽이 잠깐 불안정해요. 다시 해주세요.';
    if (/[가-힣]/.test(m)) return m;
    return '문제가 생겼어요. 다시 해주세요. (' + m + ')';
  }

  /* 서버는 한 군데: 모두용 서버(독립 스크립트, C.otherId). 누구나 자기 구글 계정 권한으로 부르고, 목록은 그 사람 앱 저장 공간 + 그 사람 캘린더.
   * 예전엔 주인 서버(주인 시트에 붙은 스크립트, C.scriptId)가 따로 있었음. 2026-11-25부터 설정에서 뺌 (아래 넘어가기 코드는 설정에 있을 때만 움직임). */
  var ids = [C.scriptId].concat(C.altIds || []).filter(Boolean), idIx = 0;
  try { var sv = Number(localStorage.getItem('fc_idix')); if (sv > 0 && sv < ids.length) idIx = sv; } catch (e) {}
  // 2026-11-24: 처음 온 계정도 바로 모두용 서버로 감. 예전엔 주인 서버에 먼저 가 보고 넘어왔는데,
  // 주인 서버(옛 코드)가 다른 계정에 엉뚱한 답을 줘서 '아직 준비 중'에 막혔음. 주인도 이미 모두용 서버로 옮겨 씀.
  function target() { return C.otherId ? C.otherId : ids[idIx]; }
  function run(fn, args, tries, force) {
    tries = tries || 0;
    return ensure().then(function (tok) {
      var id = force || target();
      return fetch('https://script.googleapis.com/v1/scripts/' + encodeURIComponent(id) + ':run', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' },
        body: JSON.stringify({ 'function': fn, parameters: args, devMode: false })
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) {
          if (r.status === 401 && tries < 2) { var x = get(); delete x.token; put(x); return run(fn, args, tries + 1, force); }
          if (!force && r.status === 404 && id !== C.otherId && idIx < ids.length - 1) { idIx++; try { localStorage.setItem('fc_idix', String(idIx)); } catch (e) {} return run(fn, args, tries); }
          if (!force && C.otherId && id !== C.otherId && (NOT_OWNER.test(rawErr(d)) || r.status === 404 || /deleted|trash|휴지통|삭제/i.test(rawErr(d)))) { var y = get(); y.srv = 'other'; put(y); return run(fn, args, tries); }
          if (!r.ok || d.error) throw new Error(errText(d, r.status));
          var res = d.response ? d.response.result : undefined;
          // 권한이 덜 허용된 표로 서버가 멈춘 경우(허용 목록을 몰라 미리 못 거른 경우): 표시해 두고 다시 허용받는 화면으로
          if (res && res.error && /You do not have permission to call|Required permissions/i.test(String(res.error)) && !get().lack) { var w = get(); w.lack = 1; put(w); location.reload(); return new Promise(function () {}); }
          // 주인 서버(옛 코드)는 시트 주인이 아닌 계정에 오류 대신 '처음 설정(needSetup)'을 돌려줌 → 다른 계정이 '아직 준비 중' 화면에 막힘.
          // 그 경우도 모두용 서버로 넘김 (계정별로 기억).
          if (!force && C.otherId && id !== C.otherId && res && res.needSetup) { var z = get(); z.srv = 'other'; put(z); return run(fn, args, tries); }
          return res;
        });
      }, function () { throw new Error('인터넷 연결을 확인해주세요.'); });
    });
  }

  // 앱 화면이 쓰는 google.script.run 흉내
  function mk(ok, bad) {
    return new Proxy({}, {
      get: function (_, name) {
        if (name === 'withSuccessHandler') return function (f) { return mk(f, bad); };
        if (name === 'withFailureHandler') return function (f) { return mk(ok, f); };
        return function () {
          var args = Array.prototype.slice.call(arguments);
          run(name, args).then(function (v) { if (ok) ok(v); }, function (e) { if (bad) bad(e); });
        };
      }
    });
  }
  window.google = window.google || {};
  window.google.script = { run: mk(null, null) };

  /* ---------- 로그인 화면 ---------- */
  function showLogin() {
    var el = document.getElementById('fcLogin');
    if (!el) return;
    el.classList.add('on');
    if (lacking(get())) {   // 구글 권한 화면에서 체크를 다 안 하고 온 경우
      var le = document.getElementById('fcErr');
      le.className = 'err lack';
      le.innerHTML = '<b>구글 권한을 모두 허용해야 쓸 수 있어요.</b><br>위 버튼을 누르고, 구글 화면에서 <b>모두 선택</b>을 체크한 뒤 계속을 눌러주세요.';
      return;
    }
    if (bye) {   // '내 자료 모두 지우기'를 끝내고 온 경우
      var er = document.getElementById('fcErr');
      er.className = 'err bye';
      er.innerHTML = '자료를 모두 지웠어요.<br>구글 계정에 남은 이 앱의 권한은 <a href="https://myaccount.google.com/connections" target="_blank" rel="noopener">구글 계정 설정</a>에서 끊을 수 있어요.';
      return;
    }
    if (inApp()) { showInApp(); return; }
    document.getElementById('fcErr').className = 'err';
    document.getElementById('fcErr').textContent = (back && back.error && back.error !== 'interaction_required' && back.error !== 'login_required' && back.error !== 'consent_required')
      ? (back.error === 'access_denied' ? '구글 화면에서 취소했어요. 다시 눌러주세요.' : '로그인이 안 됐어요 (' + back.error + '). 다시 눌러주세요.')
      : (stateLost ? '로그인 확인이 끊겼어요. 다시 눌러주세요.' : '');
  }
  /* 카카오톡·네이버·인스타그램 같은 앱 안 브라우저에서는 구글이 로그인을 막아요(403 disallowed_useragent).
   * 구글로 보내지 않고, 폰 브라우저로 여는 방법을 알려줌. */
  function inApp() {
    var ua = navigator.userAgent || '';
    if (/KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|FB_IAB|Line[/]|DaumApps|everytimeApp|BAND[/]|Twitter|Snapchat|; wv\)/i.test(ua)) return true;
    // 아이폰의 이름 모를 앱 안 브라우저: 사파리·크롬 등은 UA에 Safari/ 가 있고, 홈 화면 앱은 standalone
    var ios = /iPhone|iPad|iPod/i.test(ua), standalone = false;
    try { standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches; } catch (e) {}
    return ios && !standalone && !/Safari[/]/i.test(ua);
  }
  function showInApp() {
    var le = document.getElementById('fcErr'), ua = navigator.userAgent || '';
    var and = /Android/i.test(ua);
    le.className = 'err lack';
    le.innerHTML = '<b>이 화면(앱 안 브라우저)에서는 구글 로그인이 막혀요.</b><br>' +
      (and ? '아래 <b>크롬으로 열기</b>를 누르거나, 주소를 복사해서 크롬·삼성 인터넷에 붙여넣어 주세요.'
           : '주소를 복사해서 <b>Safari</b>에 붙여넣어 주세요.') +
      '<div class="lackbtns">' + (and ? '<a id="fcChrome" href="intent://' + location.host + location.pathname + '#Intent;scheme=https;package=com.android.chrome;end">크롬으로 열기</a>' : '') +
      '<button type="button" id="fcCopy">주소 복사</button></div>';
    var cp = document.getElementById('fcCopy');
    cp.onclick = function () {
      var u = APP_URL, okf = function () { cp.textContent = '복사했어요'; };
      var old = function () { try { var t = document.createElement('textarea'); t.value = u; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select(); t.setSelectionRange(0, u.length); document.execCommand('copy'); document.body.removeChild(t); okf(); } catch (e) { cp.textContent = u; } };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(okf, old); else old();
    };
  }
  document.addEventListener('DOMContentLoaded', function () {
    var b = document.getElementById('fcGo');
    if (b) b.onclick = function () {
      if (inApp()) { showInApp(); try { document.getElementById('fcErr').scrollIntoView({ block: 'center' }); } catch (e) {} return; }
      var x = get(); if (lacking(x)) go('consent', x.chk ? '' : (x.email || '')); else go('select_account');
    };
    if (valid(get()) && (!get().email || get().chk)) loadEmail();
    // 구글 심사(검증)를 통과한 뒤에는 '확인되지 않은 앱' 화면이 안 나와서 그 안내를 뺌
    if (C.verified) { var unv = document.getElementById('fcUnv'); if (unv && unv.parentNode) unv.parentNode.removeChild(unv); }
  });
  if (back && back.access_token) loadEmail();

  /* ---------- 서버 업데이트 (앱 주인만): 버튼 하나로 새 코드 올리고 배포까지 ----------
   * 이 사이트의 setup/Code.gs.txt 를 모두용 서버 프로젝트에 넣고 → 새 버전 → 같은 배포 주소에 연결. */
  var UPD = 'https://www.googleapis.com/auth/script.projects https://www.googleapis.com/auth/script.deployments';
  function hasUpd() { var s = get().scope || ''; return s.indexOf('script.projects') >= 0 && s.indexOf('script.deployments') >= 0; }
  function sapi(method, path, body) {
    return fetch('https://script.googleapis.com/v1/' + path, {
      method: method, headers: { Authorization: 'Bearer ' + get().token, 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (r.ok && !d.error) return d;
        var m = rawErr(d);
        if (/has not enabled the Apps Script API|usersettings/i.test(m)) throw new Error('구글 Apps Script 설정에서 API 사용을 켜야 해요: https://script.google.com/home/usersettings');
        if (r.status === 403) throw new Error('이 계정은 서버 코드를 바꿀 권한이 없어요. 앱 주인 계정으로 해주세요.');
        throw new Error(errText(d, r.status));
      });
    });
  }
  function txt(u) { return fetch(u + '?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('새 코드를 못 받았어요.'); return r.text(); }); }
  function doUpdate() {
    var sid = C.otherScript, did = C.otherId, code, man;
    if (!sid || !did) return Promise.reject(new Error('업데이트할 서버 정보가 없어요.'));
    return Promise.all([txt('setup/Code.gs.txt'), txt('setup/appsscript.json.txt')]).then(function (t) {
      code = t[0]; man = t[1];
      if (code.length < 10000) throw new Error('새 코드가 이상해요. 다시 해주세요.');
      return sapi('PUT', 'projects/' + sid + '/content', { files: [{ name: 'appsscript', type: 'JSON', source: man }, { name: 'Code', type: 'SERVER_JS', source: code }] });
    }).then(function () {
      return sapi('POST', 'projects/' + sid + '/versions', { description: '앱에서 업데이트 ' + new Date().toISOString().slice(0, 16) });
    }).then(function (v) {
      return sapi('PUT', 'projects/' + sid + '/deployments/' + did, { deploymentConfig: { scriptId: sid, versionNumber: v.versionNumber, manifestFileName: 'appsscript', description: '앱에서 업데이트 v' + v.versionNumber } })
        .then(function () { return v.versionNumber; });
    });
  }
  /** 계정을 바꾸거나 로그아웃하면 이 기기에 남은 그 계정 화면·쓰던 내용을 지움 */
  function forget() {
    try {
      Object.keys(localStorage).forEach(function (k) { if (k === 'fc_state' || k === 'fc_admin' || k.indexOf('fc_draft') === 0) localStorage.removeItem(k); });
    } catch (e) {}
  }
  var afterLogin = null;
  try { afterLogin = sessionStorage.getItem('fc_after'); sessionStorage.removeItem('fc_after'); } catch (e) {}

  window.FC_AUTH = {
    appUrl: APP_URL,
    email: email,
    // 지금 로그인은 그대로 두고 계정 고르기로 감. 취소·뒤로 가기로 돌아오면 지금 계정 그대로.
    // 다른 계정 표를 들고 돌아오면 chk 표시 → loadEmail()이 앞 계정과 다른 걸 확인하고 그때 앞 계정 것을 지움.
    switchAccount: function () { go('select_account'); },
    logout: function (byeMark) { put({}); forget(); if (byeMark) { try { sessionStorage.setItem('fc_bye', '1'); } catch (e) {} } location.reload(); },
    /** 이 기기에 남은 지난 화면을 먼저 보여줘도 되는지: 확인된 로그인 표가 있거나, 곧 조용히 새로 받을 때만 (로그인 화면이 뜰 땐 안 됨) */
    trusted: function () { var x = get(); return !x.chk && !lacking(x) && (valid(x) || !!(x.email && !silentFailed)); },
    contact: C.contact || '',
    /** 시트 → 앱 저장 공간 옮기기용: 모두용 서버(other) / 주인 서버(owner)를 골라서 부름 */
    hasOther: !!C.otherId,
    onOther: function () { return !!C.otherId && target() === C.otherId; },
    runOn: function (which, fn, args) { return run(fn, args || [], 0, which === 'other' ? C.otherId : ids[idIx]); },
    useOther: function () { var x = get(); x.srv = 'other'; put(x); },
    /** 권한을 다시 허용하고 온 직후 한 번만 true (캘린더 연동 켜기용) */
    takeCalFix: function () { var x = get(); if (!x.calfix) return false; delete x.calfix; put(x); return true; },
    serverVer: C.serverVer || 0,
    build: C.build || 0,
    verified: !!C.verified,
    canUpdate: !!(C.otherScript && C.otherId),
    /** 서버 업데이트. 처음 한 번은 구글 권한 허용 화면으로 갔다가 돌아와서 이어서 함. */
    updateServer: function () {
      if (hasUpd() && valid(get())) return doUpdate();
      try { sessionStorage.setItem('fc_after', 'update'); } catch (e) {}
      go('consent', email(), UPD);
      return new Promise(function () {});
    },
    /** 권한 허용하고 돌아온 직후면 업데이트를 이어서 함 (아니면 null) */
    resumeUpdate: function () { return (afterLogin === 'update' && back && back.access_token && hasUpd()) ? doUpdate() : null; }
  };
})();

  /* ================= 알림 ================= */

  /* ================= 폰 뒤로 가기 =================

   * 폰 뒤로 가기를 누르면 그 한 칸만 되돌림 → 앱이 꺼지지 않고 창이 닫히거나 달력 탭으로 돌아감.
   * 기록은 화면을 누른 순간에만 쌓음 (누르지 않았는데 쌓은 기록은 크롬이 뒤로 가기 때 건너뛰어서 소용없음). */

  /* ================= 서버 작업 줄 세우기 ================= */

  /* 로그인 표(1시간짜리)가 만료되면 구글에 잠깐 다녀오느라 화면이 새로 열림.
   * 그때 보내던 작업(체크·저장)이 사라지지 않게 이 창에 적어 두고, 돌아와서 처음 불러온 뒤에 이어서 함. */
  var PEND = 'fc_pending', resumed = false;

  }

  /* 두 번 보내도 결과가 같은 작업만 자동으로 다시 보냄 (추가·삭제는 두 번 들어가면 안 되니까 제외) */

  /** 구글 권한을 덜 허용해서 첫 실행 때 캘린더 연동을 못 켠 계정: 다 허용하고 돌아온 직후 한 번 켜 줌.

    var W = window.FC_AUTH;
    if (!W || !W.takeCalFix || !W.takeCalFix()) return;
    if (!S.virtual || S.calOn) return;
    cal.syncing = true; chip();
    call('api_calendar', 'on').then(function (r) {

      if (S.calOn) { toast('구글 캘린더 연동을 켰어요.'); scheduleSync(); }
    }, function () { cal.syncing = false; chip(); toast('캘린더 연동은 못 켰어요. 오른쪽 위 ⋯에서 다시 켜주세요.', { error: true }); });
  }
  function fatalHtml(msg) {
    var W = window.FC_AUTH;

        '<span style="text-align:left;display:inline-block">① 이 브라우저에서 구글 계정을 모두 로그아웃<br>② 이 앱에 쓸 계정 하나로만 로그인<br>③ 다시 시도</span><br><br><small style="opacity:.6">' + esc(msg) + '</small>' : esc(msg)) +
      '<br><br><button class="btn primary" style="display:inline-flex;padding:0 22px" id="retry" type="button">다시 시도</button>' +

      if ($('fSwitch')) $('fSwitch').onclick = function () { leave(function () { window.FC_AUTH.switchAccount(); }); };
      if ($('fLogout')) $('fLogout').onclick = function () { leave(function () { window.FC_AUTH.logout(); }); };

  /* ================= 캘린더 동기화 ================= */

  /* ---------- 내 자료 모두 지우기 (그만 쓸 때) ----------

        '<div class="grp"><button class="li" type="button" id="suCal"><span>구글 캘린더에 결제일 넣기</span><span class="switch on"></span></button></div>' +
        '<div class="ferr" id="suErr"></div>' +
        '<button class="btn primary" style="width:100%" type="button" id="suGo">시작하기</button>';
    }
    h += '<div class="who">' + (window.FC_AUTH ? '<b>' + esc(window.FC_AUTH.email() || res.email || '') + '</b> 계정으로 시작해요<br><a href="#" id="suSwitch">다른 계정으로 로그인</a>'
      : res.email ? '<b>' + esc(res.email) + '</b> 계정으로 시작해요<br>다른 계정으로 쓰려면 구글에서 계정을 바꾼 뒤 다시 열어주세요.'
      : '시트 주인인데 이 화면이 보이면, 브라우저에 구글 계정이 여러 개 로그인돼 있어서 다른 계정으로 열린 거예요. 주인 계정만 로그인된 창(시크릿 창 등)에서 열어주세요.') + '</div></div>';
    $('tab-setup').innerHTML = h;
    if ($('suSwitch')) $('suSwitch').onclick = function (e) { e.preventDefault(); window.FC_AUTH.switchAccount(); };
    var calOn = true;
    var sc = $('suCal');
    if (sc) sc.onclick = function () { calOn = !calOn; sc.querySelector('.switch').classList.toggle('on', calOn); };
    var go = $('suGo');
    if (go) go.onclick = function () {
      go.disabled = true;
      go.innerHTML = '<span class="spin"></span>내 시트 만드는 중 (10초쯤)';
      var fail = function (msg) {

        var e = $('suErr'); e.textContent = msg; e.className = 'ferr on';

      call('api_setup', { cal: calOn }).then(function (r) {
        if (!r || !r.items) { fail((r && r.error) || '잠깐 문제가 있었어요. 다시 해주세요.'); return; }

        apply(r);

        toast(notes.length ? notes.join('\n') : (r.calOn ? '준비됐어요. 구글 캘린더 연동도 켰어요.' : '준비됐어요.'), { ms: 4000 });
      }, function (err) { fail('연결이 안 됐어요. 다시 해주세요.\n(' + ((err && err.message) || err) + ')'); });
    };
  }
  function leaveSetup() {
    document.body.classList.remove('setup-on');
    $('tab-setup').innerHTML = '';
    document.querySelectorAll('.tab').forEach(function (m) { m.classList.toggle('on', m.id === 'tab-' + tab); });
    setTitle();
  }

  /* ---------- 친구에게 공유 (시트 주인만) ---------- */
  function copyText(t) {
    var okFn = function () { toast('주소를 복사했어요'); };
    var fallback = function () {
      try {
        var ta = document.createElement('textarea');
        ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); var ok = document.execCommand('copy'); ta.remove();
        if (ok) { okFn(); return; }
      } catch (e) {}
      toast('주소를 길게 눌러서 복사해주세요');
    };
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(okFn, fallback); return; } } catch (e) {}
    fallback();
  }
  function openShare(refresh) {
    var url = (window.FC_AUTH && window.FC_AUTH.appUrl) || S.appUrl || '';
    var h = '<div class="tip">친구는 이 주소를 열고 자기 구글 계정으로 로그인하면 바로 써요. 결제일은 친구 구글 캘린더에만 들어가고, 서로 내용은 안 보여요.</div>' +
      '<div class="grp">' +
      (url ? '<div class="kv" style="display:block"><div class="linkbox" style="margin-top:0">' + esc(url) + '</div></div>' +
        '<button class="li" type="button" id="shCopy"><span>주소 복사</span></button>' +
        (navigator.share ? '<button class="li" type="button" id="shSend"><span>카톡 등으로 보내기</span>' + CV + '</button>' : '') : '<div class="kv">주소를 못 찾았어요.</div>') +
      '</div>' +
      (window.FC_AUTH && window.FC_AUTH.verified ? '' : '<div class="tip">처음 로그인할 때 \'확인되지 않은 앱\' 화면이 나오면 고급 → 이동을 누르면 돼요. 구글 심사를 안 받은 개인 앱이라 나오는 화면이에요.</div>');
    if (refresh) { if (sheetMode !== 'share') return; $('sheetBody').innerHTML = h; }
    else openSheet('친구에게 알려주기', h, 'share', function () { openMenu(false); });
    var cp = $('shCopy'); if (cp) cp.onclick = function () { copyText(url); };
    var sd = $('shSend'); if (sd) sd.onclick = function () {
      try { navigator.share({ title: '고정비 달력', text: '매달 나가는 돈 달력 앱. 구글 계정으로 로그인하면 내 캘린더에 결제일이 들어가요.', url: url }).catch(function () {}); } catch (e) {}
    };
  }

  /* ================= 탭 ================= */
  function setTab(t, from) {
    if (t === tab) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    tab = t;
    if (!popping) { if (t === 'list') hPush('tab'); else if (hTop() === 'tab') hDrop(1); }
    var el = $('tab-' + t);
    if (el) { el.classList.remove('in-l', 'in-r'); void el.offsetWidth; el.classList.add(from === 'r' ? 'in-r' : 'in-l'); }
    document.body.classList.toggle('on-cal', t === 'cal');
    setTitle();
    document.querySelectorAll('.tabbar [data-tab]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === t); });
    document.querySelectorAll('.tab').forEach(function (m) { m.classList.toggle('on', m.id === 'tab-' + t); });
    if (el) fitAll(el);
    window.scrollTo(0, 0);
  }

  /* ================= 이벤트 ================= */
  function onRowClick(e) {
    var b = e.target.closest('[data-act]');
    if (!b || !S) return;
    var act = b.getAttribute('data-act');
    if (act === 'ackall') { ack(reminders().map(function (r) { return r.key; })); return; }
    if (act === 'ack') { ack([b.getAttribute('data-key')]); return; }
    var row = b.closest('.row');
    if (!row) return;
    var name = row.getAttribute('data-name');
    if (act === 'toggle') toggle(name);
    else if (act === 'del') { if (openRow === name) openRow = null; swipeOpen = null; removeItem(name); }
    else if (act === 'expand') { openRow = openRow === name ? null : name; renderList(); }
    else if (act === 'cell') editCell(b, name, b.getAttribute('data-f'));
    else if (act === 'edit') openEdit(name);
    else {
      var it = findItem(name);
      if (it && isMissing(it)) openEdit(name); else openItem(name);
    }
  }
  $('list').addEventListener('click', onRowClick);
  $('lhead').addEventListener('click', function (e) {
    var b = e.target.closest('[data-sort]');
    if (b && S) sortBy(b.getAttribute('data-sort'));
  });
  $('catFilter').addEventListener('click', function (e) {
    var b = e.target.closest('[data-cat]');
    if (!b || !S) return;
    lv.cat = b.getAttribute('data-cat');
    openRow = null;
    renderList();
    window.scrollTo(0, 0);
  });
  $('home').addEventListener('click', onRowClick);
  $('welcome').addEventListener('click', function (e) {
    if (S && e.target.closest('#wAdd')) openAdd();
  });
  $('calPrev').onclick = function () { moveMonth(-1); };
  $('calNext').onclick = function () { moveMonth(1); };
  $('calToday').onclick = function () { view.off = 0; view.sel = ''; renderHome(); };
  $('cal').addEventListener('click', function (e) {
    var c = e.target.closest('[data-day]');
    if (!c) return;
    var d = c.getAttribute('data-day');
    view.sel = view.sel === d ? '' : d;
    renderHome();
  });
  (function () {   // 달력 옆으로 밀어서 달 넘기기
    var x0 = null, y0 = 0;
    $('cal').addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
    $('cal').addEventListener('touchend', function (e) {
      if (x0 == null) return;
      var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
      x0 = null;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) moveMonth(dx < 0 ? 1 : -1);
    });
  })();
  /* 목록 줄을 왼쪽으로 밀면 삭제 버튼 (아이폰 방식) */
  var swipeOpen = null, swipeJust = false;
  function closeSwipe() { if (swipeOpen) { swipeOpen.classList.remove('swiped'); swipeOpen = null; } }
  (function () {
    var list = $('list'), row = null, x0 = 0, y0 = 0, dx = 0, mode = '', pid = null;
    list.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      var r = e.target.closest('.row.tr');
      if (!r || r.classList.contains('newr') || r.classList.contains('grey') || r.classList.contains('ghost') || e.target.closest('input, .swdel')) { row = null; return; }
      if (swipeOpen && swipeOpen !== r) closeSwipe();
      row = r; x0 = e.clientX; y0 = e.clientY; dx = 0; mode = ''; pid = e.pointerId;
    });
    list.addEventListener('pointermove', function (e) {
      if (!row || e.pointerId !== pid) return;
      var mx = e.clientX - x0, my = e.clientY - y0;
      if (!mode) {
        if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
        mode = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
        if (mode === 'x') { row.classList.add('drag'); try { row.setPointerCapture(pid); } catch (er) {} }
      }
      if (mode !== 'x') return;
      var base = row.classList.contains('swiped') ? -76 : 0;
      dx = Math.max(-110, Math.min(0, base + mx));
      row.querySelector('.tg').style.transform = 'translateX(' + dx + 'px)';
    });
    function end() {
      if (!row) return;
      var r = row; row = null;
      if (mode !== 'x') return;
      r.classList.remove('drag');
      r.querySelector('.tg').style.transform = '';
      swipeJust = true; setTimeout(function () { swipeJust = false; }, 350);
      if (dx < -38) { r.classList.add('swiped'); swipeOpen = r; buzz(); }
      else { r.classList.remove('swiped'); if (swipeOpen === r) swipeOpen = null; }
    }
    list.addEventListener('pointerup', end);
    list.addEventListener('pointercancel', end);
    // 밀고 난 직후 클릭은 무시, 열린 상태에서 다른 곳 누르면 닫기
    document.addEventListener('click', function (e) {
      if (swipeJust) { e.stopPropagation(); e.preventDefault(); return; }
      if (swipeOpen && !e.target.closest('.swdel')) { e.stopPropagation(); e.preventDefault(); closeSwipe(); }
    }, true);
  })();
  (function () {   // 화면을 옆으로 밀어서 탭 넘기기 (달력 칸 안에서는 달 넘기기)
    var x0 = null, y0 = 0, onRow = false;
    document.addEventListener('touchstart', function (e) {
      x0 = null;
      if (sheetMode || document.body.classList.contains('setup-on') || e.touches.length !== 1) return;
      var t = e.target;
      if (t.closest && t.closest('#cal, .tabbar, .toast, input, textarea, select, .chips, .seg, #fcLogin')) return;
      onRow = !!(t.closest && t.closest('#list .row.tr:not(.newr)'));
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    }, { passive: true });
    document.addEventListener('touchend', function (e) {
      if (x0 == null) return;
      var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
      x0 = null;
      if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.8) return;
      if (onRow || swipeOpen || swipeJust) return;   // 줄을 밀면 삭제 버튼만
      if (dx < 0 && tab === 'cal') setTab('list', 'l');
      else if (dx > 0 && tab === 'list') setTab('cal', 'r');
    }, { passive: true });
  })();
  document.querySelectorAll('.tabbar [data-tab]').forEach(function (b) { b.onclick = function () { setTab(b.getAttribute('data-tab')); }; });
  $('addBtn').onclick = function () {
    if (S) { openAdd(); return; }
    if (document.body.classList.contains('setup-on')) return;
    toast(busy || queue.length ? '불러오는 중이에요. 잠깐만 기다려주세요.' : '아직 못 불러왔어요. 먼저 "다시 시도"를 눌러주세요.');
  };
  $('menuBtn').onclick = function () { openMenu(false); };
  $('sync').onclick = function () {
    if (!S) return;
    if (!S.calOn) { toast('결제일을 캘린더에 넣는 기능이 꺼져 있어요. 오른쪽 위 ⋯에서 켤 수 있어요.'); return; }
    if (cal.syncing || cal.timer) { toast(cal.prog ? '캘린더에 반영하는 중이에요 (' + cal.prog + '). 앱은 그대로 써도 돼요.' : '캘린더에 반영하는 중이에요. 몇 초면 끝나요.'); return; }
    toast(cal.last || '앱에서 바꾸면 구글 캘린더도 바로 바뀌어요.');
  };
  $('toast').onclick = function (e) { if (e.target.id !== 'toastBtn') hideToast(); };
  $('backdrop').onclick = closeSheet;
  $('sheetClose').onclick = closeSheet;
  $('sheetBack').onclick = sheetUp;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (hiddenAt && Date.now() - hiddenAt > 30000 && !sheetMode) enqueue({ type: 'load', light: true });
    checkAppUpdate();
  });
  $('upbGo').onclick = upbGo;
  $('upbX').onclick = upbClose;
  (function () {   // 아래로 끌어서 닫기
    var sh = $('sheet'), y0 = null, dy = 0;
    sh.addEventListener('touchstart', function (e) {
      if ($('sheetBody').scrollTop > 0 && !e.target.closest('.sh, .grab')) { y0 = null; return; }
      y0 = e.touches[0].clientY; dy = 0;
    }, { passive: true });
    sh.addEventListener('touchmove', function (e) {
      if (y0 == null) return;
      dy = e.touches[0].clientY - y0;
      if (dy > 0) { sh.style.transition = 'none'; sh.style.transform = 'translateY(' + dy + 'px)'; }
    }, { passive: true });
    sh.addEventListener('touchend', function () {
      if (y0 == null) return;
      sh.style.transition = ''; sh.style.transform = '';
      if (dy > 110) closeSheet();
      y0 = null;
    });
  })();

  /* 화면 키보드가 올라오면 아래 창을 키보드 위로 올림 (맨 아래 '추가' 버튼이 키보드에 가리지 않게) */
  (function () {
    var vv = window.visualViewport;
    if (!vv) return;
    var root = document.documentElement, sh = $('sheet'), last = -1;
    function sync() {
      var kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
      if (kb < 100) kb = 0;   // 주소창이 접히는 정도는 키보드가 아님
      if (kb === last) return;
      last = kb;
      root.style.setProperty('--kb', kb + 'px');
      root.style.setProperty('--vvh', Math.round(vv.height) + 'px');
      sh.classList.toggle('kb', kb > 0);
      if (kb > 0) setTimeout(function () {   // 적고 있는 칸이 줄어든 창 밖으로 나갔으면 보이게
        var a = document.activeElement, body = $('sheetBody');
        if (!a || !body.contains(a)) return;
        var r = a.getBoundingClientRect(), b = body.getBoundingClientRect();
        if (r.bottom > b.bottom - 8) body.scrollTop += r.bottom - b.bottom + 24;
        else if (r.top < b.top + 8) body.scrollTop -= b.top - r.top + 24;
      }, 60);
    }
    vv.addEventListener('resize', sync);
    vv.addEventListener('scroll', sync);
  })();

  var rzTimer = null, rzW = window.innerWidth;
  window.addEventListener('resize', function () {
    if (window.innerWidth === rzW) return;   // 화면 키보드가 오르내릴 때(높이만 바뀜)는 할 일 없음
    rzW = window.innerWidth;
    clearTimeout(rzTimer); rzTimer = setTimeout(refit, 150);
  });
  try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit); } catch (e) {}

  /* ================= 시작 ================= */
  renderHome();
  var cached = load('fc_state');
  // 이 기기에 남은 지난 화면은 같은 계정일 때만 먼저 보여줌 (다른 계정 내용이 잠깐이라도 보이면 안 됨)
  var who = (window.FC_AUTH && window.FC_AUTH.trusted()) ? window.FC_AUTH.email() : '';
  if (cached && cached.items && cached.meta && (!window.FC_AUTH || (who && cached.email && cached.email.toLowerCase() === who.toLowerCase()))) { S = cached; lastGood = JSON.stringify(cached); renderAll(); chip(); }
  enqueue({ type: 'load' });
  (function () {   // 구글 권한 허용하고 돌아온 직후면 서버 업데이트 이어서
    var p = window.FC_AUTH && window.FC_AUTH.resumeUpdate && window.FC_AUTH.resumeUpdate();
    if (p) { updating = true; updAsked = true; toast('업데이트하는 중… (10초쯤)', { ms: 30000 }); p.then(updDone, updFail); }
  })();
  checkAppUpdate();
})();
</script>
<script>
(function () {
  if (window.FC_FRAMED) return;
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var evt = window.__bip || null, done = false, installed = false;
  var B = function (t) { return '<b style="display:inline">' + t + '</b>'; };
  function sync() {
    var login = document.getElementById('fcLogin');
    document.getElementById('inst').classList.toggle('on', !standalone && !done && login.classList.contains('on'));
  }
  function say(t) { document.getElementById('instText').innerHTML = t; document.getElementById('instBtn').hidden = true; }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); evt = e; installed = false; sync(); });
  window.addEventListener('appinstalled', function () { done = true; sync(); });
  new MutationObserver(sync).observe(document.getElementById('fcLogin'), { attributes: true });
  if (navigator.getInstalledRelatedApps) navigator.getInstalledRelatedApps().then(function (a) { if (a && a.length) installed = true; }).catch(function () {});
  document.getElementById('instBtn').onclick = function () {
    evt = evt || window.__bip;
    if (evt) { var e = evt; evt = window.__bip = null; e.prompt(); e.userChoice.then(function (c) { if (c.outcome === 'accepted') { done = true; sync(); } }); return; }
    if (installed) { say('<b>이미 설치돼 있어요</b>홈 화면(앱스 화면)의 ' + B('고정비 달력') + ' 아이콘으로 여세요'); return; }
    var ua = navigator.userAgent, how;
    if (/KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line[/]|DaumApps|everytimeApp/i.test(ua))
      how = '여기(앱 안 브라우저)에선 설치가 안 돼요. 메뉴 → ' + B('다른 브라우저로 열기') + ' → 크롬이나 삼성 인터넷에서 다시 눌러주세요';
    else if (/SamsungBrowser/i.test(ua)) how = '오른쪽 아래 ' + B('≡ 메뉴') + ' → ' + B('현재 페이지 추가') + ' → ' + B('홈 화면');
    else if (/iPhone|iPad/i.test(ua)) how = '아래 가운데 ' + B('공유 버튼(□↑)') + ' → ' + B('홈 화면에 추가');
    else if (/Android/i.test(ua)) how = '오른쪽 위 ' + B('⋮') + ' → ' + B('홈 화면에 추가') + ' → ' + B('설치');
    else how = '주소창 오른쪽 끝 ' + B('설치 아이콘(화면+↓)') + ' → 설치';
    say('<b>이렇게 설치해요</b>' + how);
  };
  sync();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
