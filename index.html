<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root {
  --bg: #f2f4f6; --card: #ffffff; --ink: #191f28; --ink2: #333d4b; --sub: #4e5968; --muted: #8b95a1; --faint: #c9cfd6;
  --line: #eceef1; --fill: #f2f4f6; --fill2: #e5e8eb; --child: #f8f9fa; --sel: #fff3eb;
  --accent: #f26b0f; --accent-ink: #ffffff; --ok: #03b26c; --red: #f04452; --sun: #f04452; --sat: #3182f6; --grape: #8b4ad8;
  --bar: rgba(255,255,255,.92); --backdrop: rgba(0,0,0,.32); --shadow: 0 1px 2px rgba(0,0,0,.03);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101013; --card: #1c1c21; --ink: #f2f3f5; --ink2: #dadde2; --sub: #b0b6bf; --muted: #868b94; --faint: #4a4d55;
    --line: #2a2b31; --fill: #26272d; --fill2: #33343b; --child: #222227; --sel: #3a2618;
    --accent: #ff8133; --accent-ink: #1b0d02; --ok: #1fc47d; --red: #ff5c6c; --sun: #ff6b78; --sat: #5c9dff; --grape: #b57cf2;
    --bar: rgba(22,22,26,.92); --backdrop: rgba(0,0,0,.55); --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
body {
  font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  font-size: 14px; line-height: 1.4; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; min-height: 100vh;
  font-feature-settings: "tnum"; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%;
}
input, textarea, select { -webkit-user-select: text; user-select: text; font: inherit; color: inherit; letter-spacing: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; letter-spacing: inherit; }
svg { display: block; }

/* 위 막대 */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); padding-top: env(safe-area-inset-top); }
.top-in { max-width: 600px; margin: 0 auto; height: 50px; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 20px; }
.top h1 { flex: 1; margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.035em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync { font-size: 11.5px; font-weight: 500; color: var(--muted); display: none; align-items: center; gap: 5px; padding: 6px 4px; white-space: nowrap; }
.sync.on { display: inline-flex; }
.sync.err { color: var(--red); }
.sync .sp { width: 10px; height: 10px; border: 1.6px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
.ibtn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 20px; color: var(--sub); }
.ibtn svg { width: 22px; height: 22px; }
.loadbar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; overflow: hidden; opacity: 0; transition: opacity .2s; }
.loadbar.on { opacity: 1; }
.loadbar i { position: absolute; top: 0; bottom: 0; width: 30%; background: var(--accent); border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { left: -30%; } 100% { left: 100%; } }
@keyframes spin { to { transform: rotate(360deg); } }

.tab { display: none; max-width: 600px; margin: 0 auto; padding: 0 12px calc(96px + env(safe-area-inset-bottom)); }
.tab.on { display: block; }

/* 달력 */
.cal { background: var(--card); border-radius: 22px; padding: 14px 10px 8px; box-shadow: var(--shadow); touch-action: pan-y; }
.ch { display: flex; align-items: center; gap: 4px; padding: 0 4px 10px 10px; }
.ch .mt { flex: 1; display: flex; align-items: baseline; gap: 6px; }
.ch .mt b { font-size: 20px; font-weight: 700; letter-spacing: -.04em; }
.ch .mt span { font-size: 13.5px; font-weight: 600; color: var(--muted); }
.ch .today-btn { height: 28px; padding: 0 10px; border-radius: 14px; background: var(--fill); font-size: 12px; font-weight: 600; color: var(--sub); margin-right: 2px; }
.ch .nav { width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: var(--sub); }
.ch .nav[disabled] { opacity: .25; }
.ch .nav svg { width: 18px; height: 18px; }
.cg { display: grid; grid-template-columns: repeat(7, 1fr); }
.wd { font-size: 11px; font-weight: 600; color: var(--muted); text-align: center; padding: 0 0 8px; }
.wd.sun { color: var(--sun); } .wd.sat { color: var(--sat); }
.cd { height: 54px; display: flex; flex-direction: column; align-items: center; padding-top: 3px; border-top: 1px solid var(--line); position: relative; }
.cd .n { width: 26px; height: 26px; line-height: 26px; text-align: center; border-radius: 50%; font-size: 13.5px; font-weight: 500; letter-spacing: -.02em; }
.cd.sun .n, .cd.hol .n { color: var(--sun); }
.cd.sat .n { color: var(--sat); }
.cd.past .n { opacity: .42; }
.cd.today .n { background: var(--accent); color: var(--accent-ink); font-weight: 700; opacity: 1; }
.cd.sel::before { content: ""; position: absolute; inset: 2px 3px; border-radius: 12px; background: var(--sel); z-index: 0; }
.cd > * { position: relative; z-index: 1; }
.cd .a { font-size: 11px; font-weight: 600; line-height: 15px; margin-top: 2px; color: var(--sub); letter-spacing: -.03em; white-space: nowrap; }
.cd .a.done { color: var(--faint); }
.cd .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--red); margin-top: 3px; }
.cd.has { cursor: pointer; }

/* 이번 달 요약 */
.sum { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border-radius: 18px; padding: 12px 4px; margin: 10px 0 20px; box-shadow: var(--shadow); }
.sum > div { padding: 0 12px; min-width: 0; }
.sum > div + div { border-left: 1px solid var(--line); }
.sum span { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
.sum b { display: block; font-size: 14.5px; font-weight: 700; letter-spacing: -.03em; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sum b.acc { color: var(--accent); }

/* 목록 공통 */
.sec { display: flex; align-items: baseline; gap: 6px; padding: 0 6px 9px; }
.sec h3 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.035em; }
.sec .c { font-size: 14px; font-weight: 600; color: var(--muted); }
.sec .r { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.sec button.r { color: var(--accent); }
.gh { display: flex; align-items: baseline; gap: 6px; padding: 4px 6px 8px; }
.gh .t { font-size: 13.5px; font-weight: 700; color: var(--ink2); letter-spacing: -.03em; white-space: nowrap; }
.gh .s { flex: 1; min-width: 0; font-size: 12px; font-weight: 500; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gh button { font-size: 12px; font-weight: 600; color: var(--accent); padding: 2px 0; }
.grp { background: var(--card); border-radius: 20px; overflow: hidden; margin-bottom: 22px; box-shadow: var(--shadow); }
.row { position: relative; display: flex; align-items: stretch; min-height: 52px; background: var(--card); }
.grp > * + *::after { content: ""; position: absolute; left: 52px; right: 16px; top: 0; height: 1px; background: var(--line); }
.chk { flex: none; width: 52px; display: flex; align-items: center; justify-content: center; }
.chk i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--faint); display: flex; align-items: center; justify-content: center; color: transparent; transition: background .15s, border-color .15s; }
.chk i svg { width: 12px; height: 12px; }
.chk.static { cursor: default; }
.checked .chk i { background: var(--ok); border-color: var(--ok); color: #fff; }
.rb { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 8px 18px 8px 0; }
.row.hasx .rb { padding-right: 2px; }
.t1 { display: flex; align-items: baseline; gap: 10px; }
.nm { flex: 1; min-width: 0; font-size: 14.5px; font-weight: 600; letter-spacing: -.025em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.amt { flex: none; font-size: 14.5px; font-weight: 700; letter-spacing: -.03em; white-space: nowrap; }
.amt.none { color: var(--muted); font-weight: 500; font-size: 12px; }
.t2 { font-size: 12px; font-weight: 500; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.over { color: var(--red); font-weight: 600; }
.soon { color: var(--accent); font-weight: 600; }
.lastp { color: var(--grape); }
.x { flex: none; width: 42px; display: flex; align-items: center; justify-content: center; color: var(--faint); }
.x svg { width: 12px; height: 12px; }
.checked .nm, .checked .amt, .row.muted .nm, .row.muted .amt { color: var(--muted); }
.row.child { background: var(--child); }
.row.child .chk { margin-left: 18px; }
.row.child .nm { font-size: 13.5px; font-weight: 500; }
.row.child .amt { font-size: 13.5px; font-weight: 600; }
.grp > .row.child::after { left: 70px; }
.row.grey { background: var(--fill); }
.row.pending .chk i { opacity: .8; }
.row.flash { animation: flash 1.3s ease-out; }
@keyframes flash { 0%, 30% { background: var(--sel); } }
.row.gone { opacity: 0; transform: translateX(30px); transition: opacity .2s, transform .2s; }
.row.enter { animation: enter .3s ease-out; }
@keyframes enter { from { opacity: 0; } }
.note { position: relative; padding: 11px 18px; font-size: 12px; font-weight: 500; color: var(--sub); background: var(--card); }
.empty { padding: 20px 16px; font-size: 13px; font-weight: 500; color: var(--muted); text-align: center; }
.moreline { display: block; width: 100%; margin-top: -12px; padding: 0 8px 20px; font-size: 12px; font-weight: 500; color: var(--muted); text-align: left; }
.moreline b { color: var(--accent); font-weight: 600; }
.bar2 { display: flex; align-items: center; justify-content: space-between; padding: 2px 6px 12px; font-size: 12px; font-weight: 500; color: var(--muted); }
.sortsel { position: relative; display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px; border-radius: 14px; background: var(--card); color: var(--ink2); font-weight: 600; box-shadow: var(--shadow); }
.sortsel select { position: absolute; inset: 0; opacity: 0; width: 100%; }
.sortsel svg { width: 10px; height: 10px; }
.skel { height: 52px; background: var(--card); border-radius: 20px; margin-bottom: 10px; opacity: .7; }
.fatal { padding: 30px 16px; text-align: center; color: var(--muted); font-size: 13px; }
.fatal b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 6px; }
.fatal-acc { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; font-size: 13px; }
.fatal-acc span { flex-basis: 100%; color: var(--muted); overflow-wrap: anywhere; }
.fatal-acc button { color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 8px 4px; min-height: 40px; }

/* 아래 탭 */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabbar-in { max-width: 600px; margin: 0 auto; display: flex; height: 54px; }
.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; font-weight: 600; color: var(--muted); }
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button.on { color: var(--ink); }
.tabbar .add i { width: 44px; height: 44px; border-radius: 22px; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(242,107,15,.3); }
.tabbar .add i svg { width: 20px; height: 20px; }

/* 아래에서 올라오는 창 */
.backdrop { position: fixed; inset: 0; z-index: 40; background: var(--backdrop); opacity: 0; pointer-events: none; transition: opacity .25s; }
.backdrop.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 600px; margin: 0 auto; background: var(--bg); border-radius: 24px 24px 0 0; max-height: 92vh; display: flex; flex-direction: column; transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.85,.25,1); }
.sheet.on { transform: translateY(0); }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--fill2); margin: 8px auto 0; flex: none; }
.sh { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 20px; flex: none; }
.sh h2 { flex: 1; margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.035em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 2px 12px calc(20px + env(safe-area-inset-bottom)); }
.dh { padding: 0 8px 16px; }
.dh .da { font-size: 23px; font-weight: 700; letter-spacing: -.04em; }
.dh .da small { font-size: 12.5px; font-weight: 500; color: var(--muted); margin-left: 6px; letter-spacing: -.01em; }
.dh .ds { font-size: 12.5px; font-weight: 500; color: var(--sub); margin-top: 2px; }
.btns { display: flex; gap: 8px; margin-bottom: 16px; }
.btn { flex: 1; height: 46px; border-radius: 13px; background: var(--card); font-size: 14.5px; font-weight: 600; text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ok { background: var(--ok); color: #fff; }
.btn[disabled] { opacity: .6; }
.btn svg { width: 16px; height: 16px; }
.kv { display: flex; align-items: baseline; gap: 12px; padding: 12px 18px; font-size: 14px; position: relative; }
.kv .k { flex: none; width: 88px; color: var(--muted); font-weight: 500; }
.kv .v { flex: 1; min-width: 0; text-align: right; word-break: break-all; font-weight: 500; }
.kv .v small { display: block; color: var(--muted); font-size: 11.5px; }
.kv.memo .v { text-align: left; white-space: pre-wrap; }
.grp > .kv + .kv::after, .grp > .f + .f::after, .grp > .li + .li::after { left: 18px; right: 18px; }
.li { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 0 18px; font-size: 14px; font-weight: 500; position: relative; text-align: left; text-decoration: none; color: var(--ink); }
.li > span:first-child { flex: none; white-space: nowrap; }
.li .r { margin-left: auto; min-width: 0; color: var(--muted); font-size: 12.5px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li.red { color: var(--red); justify-content: center; }
.switch { margin-left: auto; width: 44px; height: 26px; border-radius: 13px; background: var(--fill2); position: relative; transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch.on { background: var(--ok); }
.switch.on::after { transform: translateX(18px); }
.tip { font-size: 12px; color: var(--muted); padding: 0 8px 18px; line-height: 1.55; }
.tipline { font-size: 12px; font-weight: 500; color: var(--sub); background: var(--fill); border-radius: 12px; padding: 10px 14px; margin: -6px 0 16px; }
.linkbox { margin-top: 8px; padding: 9px 11px; border-radius: 10px; background: var(--fill); font-size: 11.5px; word-break: break-all; -webkit-user-select: all; user-select: all; }

/* 입력 */
.f { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 4px 18px; position: relative; }
.f > label { flex: none; width: 88px; font-size: 13.5px; font-weight: 500; color: var(--sub); line-height: 1.2; }
.f > label em { display: block; font-style: normal; font-size: 10px; font-weight: 600; color: var(--accent); margin-top: 2px; }
.f > label em.req { color: var(--red); }
.f .ctl { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
.f.stack { flex-direction: column; align-items: stretch; gap: 4px; padding: 12px 18px; }
.f.stack > label { width: auto; }
.f input, .f select, .f textarea { width: 100%; min-width: 0; border: 0; background: transparent; font-size: 14.5px; font-weight: 500; padding: 8px 0; outline: none; -webkit-appearance: none; appearance: none; }
.f select { padding-right: 16px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 7px) 50%, calc(100% - 2px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.f textarea { resize: none; padding: 4px 0; }
.f input::placeholder, .f textarea::placeholder { color: var(--faint); }
.f select:invalid { color: var(--faint); }
.f select option { color: var(--ink); }
.f.badf > label { color: var(--red); }
.f .unit { color: var(--muted); font-size: 14.5px; }
.mini { flex: none; font-size: 11.5px; font-weight: 500; color: var(--sub); padding: 5px 9px; border-radius: 8px; background: var(--fill); }
.seg { display: flex; background: var(--fill); border-radius: 10px; padding: 2px; gap: 2px; flex: none; }
.seg button { height: 28px; padding: 0 10px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.datebtn { flex: 1; min-width: 0; text-align: left; font-size: 14.5px; font-weight: 500; color: var(--ink); padding: 8px 0; }
.datebtn.empty { color: var(--faint); }
.dpback { position: fixed; inset: 0; z-index: 50; background: var(--backdrop); opacity: 0; pointer-events: none; transition: opacity .2s; }
.dpback.on { opacity: 1; pointer-events: auto; }
.dp { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; max-width: 600px; margin: 0 auto; background: var(--card); border-radius: 24px 24px 0 0; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.85,.25,1); }
.dp.on { transform: translateY(0); }
.dp .dph { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 10px; }
.dp .dpt { font-size: 15px; font-weight: 700; color: var(--ink); }
.dp .dpl { font-size: 12px; font-weight: 600; color: var(--muted); }
.dp .nav, .dp .dpf button, .dp .dpg button { display: flex; align-items: center; justify-content: center; }
.dp .nav { width: 34px; height: 34px; border-radius: 10px; font-size: 18px; color: var(--sub); background: var(--fill); }
.dp .dpw, .dp .dpg { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
.dp .dpw span { font-size: 11px; font-weight: 600; color: var(--muted); padding: 4px 0; }
.dp .dpw span:first-child { color: var(--sun); } .dp .dpw span:last-child { color: var(--sat); }
.dp .dpg button { height: 38px; margin: 1px; border-radius: 12px; font-size: 14px; font-weight: 500; color: var(--ink); }
.dp .dpg button.sun { color: var(--sun); } .dp .dpg button.sat { color: var(--sat); }
.dp .dpg button.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
.dp .dpg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.dp .dpf { display: flex; gap: 8px; padding-top: 10px; }
.dp .dpf button { flex: 1; height: 42px; border-radius: 12px; font-size: 13.5px; font-weight: 600; background: var(--fill); color: var(--sub); }
.ferr { display: none; margin: 0 0 12px; padding: 10px 14px; border-radius: 12px; background: rgba(240,68,82,.1); color: var(--red); font-size: 12.5px; font-weight: 500; white-space: pre-line; }
.ferr.on { display: block; }
.ferr.warn { background: rgba(242,107,15,.1); color: var(--accent); }
.glabel { font-size: 12.5px; font-weight: 700; color: var(--sub); padding: 0 8px 8px; letter-spacing: -.02em; }
.spin { width: 15px; height: 15px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }

.toast { position: fixed; left: 50%; bottom: calc(72px + env(safe-area-inset-bottom)); z-index: 60; transform: translate(-50%, 12px); width: calc(100% - 24px); max-width: 560px; background: rgba(36,38,44,.96); color: #fff; border-radius: 16px; padding: 13px 14px 13px 18px; font-size: 13.5px; font-weight: 500; display: flex; align-items: center; gap: 12px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s; white-space: pre-line; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast.error { background: var(--red); }
.toast span { flex: 1; }
.toast button { flex: none; font-weight: 700; color: #ffb27a; padding: 4px 2px; }
.toast.error button { color: #fff; text-decoration: underline; }

/* 결제 수단 칩 */
.lrow { display: flex; align-items: baseline; gap: 8px; }

  /* 두 번 보내도 결과가 같은 작업만 자동으로 다시 보냄 (추가·삭제는 두 번 들어가면 안 되니까 제외) */
  var RESEND_OK = { load: 1, checks: 1, sort: 1, accounts: 1 };
  function isNetErr(msg) { return /인터넷 연결|불안정|오래 걸렸|연결이 안 됐/.test(msg) || navigator.onLine === false; }
  function opCount(op) { return op.type === 'checks' ? Object.keys(op.map).length : 1; }
  /** 저장 못 한 작업을 사용자가 '다시 시도'로 다시 함 */

  function fatalHtml(msg) {
    var W = window.FC_AUTH;
    // 구글 계정이 여러 개 로그인된 브라우저에서 구글 쪽이 다른 계정으로 요청을 보내 생기는 문제 → 해결 방법을 바로 보여줌
    var multi = !W && /권한|permission|access|authoriz/i.test(msg);
    return '<div class="fatal"><b>' + (multi ? '구글 계정이 섞였어요' : '불러오지 못했어요') + '</b>' +
      (multi ? '이 브라우저에 구글 계정이 2개 이상 로그인돼 있으면 구글이 다른 계정으로 시트를 열려고 해서 생기는 문제예요.<br><br>' +
        '<span style="text-align:left;display:inline-block">① 이 브라우저에서 구글 계정을 모두 로그아웃<br>② 이 앱에 쓸 계정 하나로만 로그인<br>③ 다시 시도</span><br><br><small style="opacity:.6">' + esc(msg) + '</small>' : esc(msg)) +
      '<br><br><button class="btn primary" style="display:inline-flex;padding:0 22px" id="retry" type="button">다시 시도</button>' +
      (W ? '<div class="fatal-acc">' + (W.email() ? '<span>' + esc(W.email()) + '</span>' : '') +

  }
  function failed(op, err) {
    var msg = (err && err.message) ? err.message : String(err);
    // 1) 연결 문제면 잠깐 뒤 자동으로 다시 보냄 (두 번까지)
    if (RESEND_OK[op.type] && isNetErr(msg) && (op.fails || 0) < 2) {

    // 2) 끝내 안 됐으면: 줄 서 있던 작업을 다 내리고, 화면을 서버가 마지막으로 확인해 준 상태로 되돌림
    //    (서버엔 저장이 안 됐는데 화면엔 '냄'으로 남아 있으면 안 낸 돈을 냈다고 믿게 됨)

    if (!S) {
      $('home').innerHTML = fatalHtml(msg);
      $('retry').onclick = function () { this.disabled = true; this.textContent = '불러오는 중…'; enqueue({ type: 'load' }); };
      if ($('fSwitch')) $('fSwitch').onclick = function () { window.FC_AUTH.switchAccount(); };
      if ($('fLogout')) $('fLogout').onclick = function () { window.FC_AUTH.logout(); };

    }

    pendingState = null;
    clearTimeout(moveTimer); moveTimer = null;
    if (st) apply(st);
    var redo = lost.filter(function (o) { return !o.onError; });
    if (!redo.length) {
      if (op.type === 'load') toast('연결이 안 돼서 새로 못 불러왔어요. 지금 화면은 마지막으로 불러온 내용이에요.', { error: true, action: '다시 시도', ms: 7000, onAction: function () { enqueue({ type: 'load', light: true }); } });

  /* ================= 캘린더 동기화 ================= */
  function chip() {
    var c = $('sync'), t = $('syncTxt');
    if (!S) return;
    if (!S.calOn) { c.className = 'sync on'; t.textContent = '캘린더 꺼짐'; c.querySelector('.sp').style.display = 'none'; }
    else if (cal.syncing || cal.timer) { c.className = 'sync on'; t.textContent = '캘린더 반영 중'; c.querySelector('.sp').style.display = ''; }
    else if (cal.err) { c.className = 'sync on err'; t.textContent = '캘린더 확인 필요'; c.querySelector('.sp').style.display = 'none'; }
    else { c.className = 'sync'; t.textContent = ''; }
    if (sheetMode === 'menu') openMenu(true);
  }
  function scheduleSync() {
    if (!S || !S.calOn) { chip(); return; }
    clearTimeout(cal.timer);
    cal.timer = setTimeout(runSync, 250);
    chip();
  }
  function runSync() {
    cal.timer = null;
    if (busy || queue.length) { cal.timer = setTimeout(runSync, 500); chip(); return; }
    if (cal.syncing) { cal.again = true; return; }
    cal.syncing = true;
    chip();
    call('api_sync').then(function (r) {
      cal.syncing = false;
      cal.last = (r && r.msg) || '';
      cal.err = /못|실패/.test(cal.last);
      if (r && r.off) S.calOn = false;
      if (cal.last.indexOf('나눠서') >= 0) toast(cal.last);
      if (cal.again) { cal.again = false; runSync(); return; }
      chip();
    }, function (e) {
      cal.syncing = false;
      cal.err = true;
      cal.last = '캘린더 반영 실패: ' + ((e && e.message) || e);
      if (cal.again) { cal.again = false; runSync(); return; }
      chip();
    });
  }

  /* ================= 줄 순서 (시트의 정렬 값·정렬 키 수식과 같은 규칙) ================= */
  function afOf(it, mode) {
    var a = it.amount;
    var d = pad(it.next ? serial(it.next) : 99999, 5);
    var o = pad(typeof it.order === 'number' ? it.order : 999, 3);
    var pre = mode === '금액 큰 순' ? pad(999999999 - (a == null ? 0 : a), 9)
      : mode === '금액 작은 순' ? pad(a == null ? 999999999 : a, 9)
      : mode === '내가 정한 순서' ? o : '';
    return pre + '/' + d + '/' + o;
  }
  function resort() {
    var byName = {};
    S.items.forEach(function (it) { if (!it.sep && !byName[it.name]) byName[it.name] = it; });
    var arr = S.items.map(function (it, i) {
      if (it.sep) return { it: it, i: i, k: '2' };
      var p = it.parent ? byName[it.parent] : null;
      var g = p && p.section === it.section ? p.af : it.af;
      it.key = it.section + '|' + g + '|' + (it.parent || it.name) + '|' + (it.parent ? '1' : '0') + '|' + it.af + '|' + it.name;
      return { it: it, i: i, k: it.key };
    });
    arr.sort(function (a, b) { return a.k < b.k ? -1 : a.k > b.k ? 1 : a.i - b.i; });
    S.items = arr.map(function (x) { return x.it; });
  }

  /* ================= 분류 ================= */
  function isMissing(it) { return it.section === 1 && !it.next; }
  function isUnpaid(it) { return it.section === 1 && !it.checked && !!it.next; }
  function isOverdue(it) { return isUnpaid(it) && it.next < today(); }
  function isOverduePrev(it) { return isUnpaid(it) && it.next < monthStart(); }
  /** 지난달 결제일이 있었는데 체크 기록이 없는 항목 (앱을 쓰기 시작한 달부터). */
  function prevDue(it) {
    if (!it.day || !it.start) return '';
    var pm = prevMonth();
    if (S.since && pm.s < S.since) return '';
    var aa = /^(\d{4})-(\d{2})$/.exec(it.aaMonth || '');
    if (!aa) return '';
    var mo = (pm.y * 12 + pm.m) - (+aa[1] * 12 + +aa[2]);
    var every = it.every || 1;
    if (mo < 0 || mo % every) return '';
    var due = ymd(pm.y, pm.m, Math.min(it.day, lastDay(pm.y, pm.m)));
    if (due < it.start) return '';
    if (it.endDate && due > it.endDate) return '';
    return due;
  }
  function reminders() {
    var out = [];
    var pm = prevMonth();
    items().forEach(function (it) {
      if (isOverduePrev(it)) return;
      var due = prevDue(it);
      if (!due) return;
      if (it.paid && it.paid >= due) return;
      if (S.ack && S.ack[it.name + '|' + pm.s]) return;
      out.push({ it: it, due: due, key: it.name + '|' + pm.s });

    return out;
  }
  /** 그 달 결제일 목록 (시트의 월별 금액 칸과 같은 규칙). st: paid / missed / due */
  function occurrences(y, m) {
    var out = [];
    var ts = today();
    var cur = parse(ts);
    var ym = y + '-' + pad(m, 2);
    var curYm = ts.slice(0, 7);
    items().forEach(function (it) {
      if (!it.day) return;
      var every = it.every || 1;
      if (every > 1 && !it.start) return;
      var aa = /^(\d{4})-(\d{2})$/.exec(it.aaMonth || '');
      var ay = aa ? +aa[1] : cur.y, am = aa ? +aa[2] : cur.m;
      var mo = (y * 12 + m) - (ay * 12 + am);
      if (mo < 0 || mo % every) return;
      var due = ymd(y, m, Math.min(it.day, lastDay(y, m)));

      if (it.endDate && due > it.endDate) return;

  function viewYM() {

  /* ================= 줄 하나 ================= */

  function rowHtml(o) {

  /* ================= 1번 화면: 달력 ================= */
  function renderHome() {

  /* ================= 2번 화면: 목록 ================= */
  function line2For(it, showParent) {

    else if (it.section === 1) parts.push(dueTxt(it.next, !it.checked));

  /* ================= 납부 체크 ================= */

      return;
    }
    buzz();
    if (!sticky[name]) sticky[name] = { next: it.next, home: isUnpaid(it) };
    it.checked = !it.checked;
    it.pending = true;
    if (it.checked) {
      it.prev = it.paid || '-';
      it.paid = it.next;
      var nx = it.next ? addMonths(it.next, it.every || 1, it.day) : '';
      if (nx && it.endDate && nx > it.endDate) { it.next = ''; it.nextText = '남은 결제 없음'; it.section = 5; it.status = '완료'; }
      else { it.next = nx; it.section = 3; }
    } else {
      var back = it.paid;
      it.paid = it.prev && it.prev !== '-' ? it.prev : '';
      it.prev = '';

      if (it.section === 5) it.status = '진행중';

  function control(f, val, selfName) {

  /** 칸마다 예시 (입력 칸 안 회색 글씨) */

  /* 쓰던 내용: 실수로 닫혀도 다시 열면 그대로 (기기에 임시 저장) */

      go.innerHTML = '<span class="spin"></span>내 시트 만드는 중 (10초쯤)';
      var fail = function (msg) {
        go.disabled = false; go.textContent = '다시 시도';
        var e = $('suErr'); e.textContent = msg; e.className = 'ferr on';
      };
      call('api_setup', { cal: calOn }).then(function (r) {
        if (!r || !r.items) { fail((r && r.error) || '잠깐 문제가 있었어요. 다시 해주세요.'); return; }
        leaveSetup();
        apply(r);
        var notes = (r.notes || []).filter(Boolean);
        toast(notes.length ? notes.join('\n') : (r.calOn ? '준비됐어요. 구글 캘린더 연동도 켰어요.' : '준비됐어요.'), { ms: 4000 });
      }, function (err) { fail('연결이 안 됐어요. 다시 해주세요.\n(' + ((err && err.message) || err) + ')'); });
    };
  }
  function leaveSetup() {
    document.body.classList.remove('setup-on');
    $('tab-setup').innerHTML = '';
    document.querySelectorAll('.tab').forEach(function (m) { m.classList.toggle('on', m.id === 'tab-' + tab); });
    $('title').textContent = tab === 'cal' ? '고정비 결제 달력' : '고정비 목록';
  }

  /* ---------- 친구에게 공유 (시트 주인만) ---------- */
  function copyText(t) {
    var okFn = function () { toast('주소를 복사했어요'); };
    var fallback = function () {
      try {
        var ta = document.createElement('textarea');
        ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); var ok = document.execCommand('copy'); ta.remove();
        if (ok) { okFn(); return; }
      } catch (e) {}
      toast('주소를 길게 눌러서 복사해주세요');
    };
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(okFn, fallback); return; } } catch (e) {}
    fallback();
  }
  function openShare(refresh) {
    var url = (window.FC_AUTH && window.FC_AUTH.appUrl) || S.appUrl || '';
    var h = '<div class="tip" style="padding-top:0">친구는 이 주소를 열고 자기 구글 계정으로 로그인하면 바로 써요. 결제일은 친구 구글 캘린더에만 들어가고, 친구 드라이브에 시트가 생기지 않아요. 서로 내용은 안 보여요.</div>' +
      '<div class="grp">' +
      (url ? '<div class="kv" style="display:block"><div class="linkbox" style="margin-top:0">' + esc(url) + '</div></div>' +
        '<button class="li" type="button" id="shCopy"><span>주소 복사</span></button>' +
        (navigator.share ? '<button class="li" type="button" id="shSend"><span>카톡 등으로 보내기</span></button>' : '') : '<div class="kv">주소를 못 찾았어요.</div>') +
      '</div>' +
      '<div class="tip">처음 로그인할 때 \'확인되지 않은 앱\' 화면이 나오면 고급 → 이동을 누르면 돼요. 구글 심사를 안 받은 개인 앱이라 나오는 화면이에요.</div>';
    if (refresh) { if (sheetMode !== 'share') return; $('sheetBody').innerHTML = h; }
    else openSheet('친구에게 공유', h, 'share', function () { openMenu(false); });
    var cp = $('shCopy'); if (cp) cp.onclick = function () { copyText(url); };
    var sd = $('shSend'); if (sd) sd.onclick = function () {
      try { navigator.share({ title: '승훈스 고정비앱 V1', text: '매달 나가는 돈 달력 앱. 구글 계정으로 로그인하면 내 캘린더에 결제일이 들어가요.', url: url }).catch(function () {}); } catch (e) {}
    };
  }

  /* ================= 탭 ================= */
  function setTab(t, from) {
    if (t === tab) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    tab = t;
    var el = $('tab-' + t);
    if (el) { el.classList.remove('in-l', 'in-r'); void el.offsetWidth; el.classList.add(from === 'r' ? 'in-r' : 'in-l'); }
    $('title').textContent = t === 'cal' ? '고정비 결제 달력' : '고정비 목록';
    document.querySelectorAll('.tabbar [data-tab]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === t); });
    document.querySelectorAll('.tab').forEach(function (m) { m.classList.toggle('on', m.id === 'tab-' + t); });
    window.scrollTo(0, 0);
  }

  /* ================= 이벤트 ================= */
  function onbHtml() {
    var hasAcc = (S.accounts || []).length > 0;
    return '<div class="onb"><b>첫 고정비를 넣어볼까요?</b><span>월세, 통신비, 구독료처럼 매달 나가는 돈을 넣으면 달력에 표시돼요.</span>' +
      '<div class="btns">' + (S.accounts ? '<button class="btn" type="button" data-act="onb-acc">' + (hasAcc ? '결제 수단 관리' : '결제 수단 먼저 등록') + '</button>' : '') +
      '<button class="btn primary" type="button" data-act="onb-add">항목 추가</button></div></div>';
  }
  function onRowClick(e) {
    var b = e.target.closest('[data-act]');
    if (!b || !S) return;
    var act = b.getAttribute('data-act');
    if (act === 'onb-add') { openAdd(); return; }
    if (act === 'onb-acc') { openAccounts(false, null); return; }
    if (act === 'ackall') { ack(reminders().map(function (r) { return r.key; })); return; }
    if (act === 'ack') { ack([b.getAttribute('data-key')]); return; }
    var row = b.closest('.row');
    if (!row) return;
    var name = row.getAttribute('data-name');
    if (act === 'toggle') toggle(name);
    else if (act === 'del') { if (openRow === name) openRow = null; swipeOpen = null; removeItem(name); }
    else if (act === 'expand') { openRow = openRow === name ? null : name; renderList(); }
    else if (act === 'cell') editCell(b, name, b.getAttribute('data-f'));
    else if (act === 'edit') openEdit(name);
    else {
      var it = findItem(name);
      if (it && isMissing(it)) openEdit(name); else openItem(name);
    }
  }
  $('list').addEventListener('click', onRowClick);
  $('home').addEventListener('click', onRowClick);
  $('cal').addEventListener('click', function (e) {
    var c = e.target.closest('[data-day]');
    if (!c) return;
    var d = c.getAttribute('data-day');
    view.sel = view.sel === d ? '' : d;
    renderHome();
  });
  (function () {   // 달력 옆으로 밀어서 달 넘기기
    var x0 = null, y0 = 0;
    $('cal').addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
    $('cal').addEventListener('touchend', function (e) {
      if (x0 == null) return;
      var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
      x0 = null;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) moveMonth(dx < 0 ? 1 : -1);
    });
  })();
  /* 목록 줄을 왼쪽으로 밀면 삭제 버튼 (아이폰 방식) */
  var swipeOpen = null, swipeJust = false;
  function closeSwipe() { if (swipeOpen) { swipeOpen.classList.remove('swiped'); swipeOpen = null; } }
  (function () {
    var list = $('list'), row = null, x0 = 0, y0 = 0, dx = 0, mode = '', pid = null;
    list.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      var r = e.target.closest('.row.tr');
      if (!r || r.classList.contains('newr') || r.classList.contains('grey') || e.target.closest('input, .swdel')) { row = null; return; }
      if (swipeOpen && swipeOpen !== r) closeSwipe();
      row = r; x0 = e.clientX; y0 = e.clientY; dx = 0; mode = ''; pid = e.pointerId;
    });
    list.addEventListener('pointermove', function (e) {
      if (!row || e.pointerId !== pid) return;
      var mx = e.clientX - x0, my = e.clientY - y0;
      if (!mode) {
        if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
        mode = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
        if (mode === 'x') { row.classList.add('drag'); try { row.setPointerCapture(pid); } catch (er) {} }
      }
      if (mode !== 'x') return;
      var base = row.classList.contains('swiped') ? -76 : 0;
      dx = Math.max(-110, Math.min(0, base + mx));
      row.querySelector('.tg').style.transform = 'translateX(' + dx + 'px)';
    });
    function end() {
      if (!row) return;
      var r = row; row = null;
      if (mode !== 'x') return;
      r.classList.remove('drag');
      r.querySelector('.tg').style.transform = '';
      swipeJust = true; setTimeout(function () { swipeJust = false; }, 350);
      if (dx < -38) { r.classList.add('swiped'); swipeOpen = r; buzz(); }
      else { r.classList.remove('swiped'); if (swipeOpen === r) swipeOpen = null; }
    }
    list.addEventListener('pointerup', end);
    list.addEventListener('pointercancel', end);
    // 밀고 난 직후 클릭은 무시, 열린 상태에서 다른 곳 누르면 닫기
    document.addEventListener('click', function (e) {
      if (swipeJust) { e.stopPropagation(); e.preventDefault(); return; }
      if (swipeOpen && !e.target.closest('.swdel')) { e.stopPropagation(); e.preventDefault(); closeSwipe(); }
    }, true);
  })();
  (function () {   // 화면을 옆으로 밀어서 탭 넘기기 (달력 칸 안에서는 달 넘기기)
    var x0 = null, y0 = 0, onRow = false;
    document.addEventListener('touchstart', function (e) {
      x0 = null;
      if (sheetMode || document.body.classList.contains('setup-on') || e.touches.length !== 1) return;
      var t = e.target;
      if (t.closest && t.closest('#cal, .tabbar, .toast, input, textarea, select, .chips, .seg, #fcLogin')) return;
      onRow = !!(t.closest && t.closest('#list .row.tr:not(.newr)'));
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    }, { passive: true });
    document.addEventListener('touchend', function (e) {
      if (x0 == null) return;
      var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
      x0 = null;
      if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.8) return;
      if (onRow || swipeOpen || swipeJust) return;   // 줄을 밀면 삭제 버튼만
      if (dx < 0 && tab === 'cal') setTab('list', 'l');
      else if (dx > 0 && tab === 'list') setTab('cal', 'r');
    }, { passive: true });
  })();
  document.querySelectorAll('.tabbar [data-tab]').forEach(function (b) { b.onclick = function () { setTab(b.getAttribute('data-tab')); }; });
  $('addBtn').onclick = function () {
    if (S) { openAdd(); return; }
    if (document.body.classList.contains('setup-on')) return;
    toast(busy || queue.length ? '불러오는 중이에요. 잠깐만 기다려주세요.' : '아직 못 불러왔어요. 먼저 "다시 시도"를 눌러주세요.');
  };
  $('menuBtn').onclick = function () { openMenu(false); };
  $('sync').onclick = function () {
    if (!S) return;
    if (!S.calOn) { toast('캘린더 연동이 꺼져 있어요. 오른쪽 위 ⋯에서 켤 수 있어요.'); return; }
    if (cal.syncing || cal.timer) { toast('캘린더에 반영하는 중이에요. 몇 초면 끝나요.'); return; }
    toast(cal.last || '앱에서 바꾸면 구글 캘린더도 바로 바뀌어요.');
  };
  $('toast').onclick = function (e) { if (e.target.id !== 'toastBtn') hideToast(); };
  $('backdrop').onclick = closeSheet;
  $('sheetClose').onclick = closeSheet;
  $('sheetBack').onclick = function () { if (sheetBackFn) sheetBackFn(); };
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (hiddenAt && Date.now() - hiddenAt > 30000 && !sheetMode) enqueue({ type: 'load', light: true });
  });
  (function () {   // 아래로 끌어서 닫기
    var sh = $('sheet'), y0 = null, dy = 0;
    sh.addEventListener('touchstart', function (e) {
      if ($('sheetBody').scrollTop > 0 && !e.target.closest('.sh, .grab')) { y0 = null; return; }
      y0 = e.touches[0].clientY; dy = 0;
    }, { passive: true });
    sh.addEventListener('touchmove', function (e) {
      if (y0 == null) return;
      dy = e.touches[0].clientY - y0;
      if (dy > 0) { sh.style.transition = 'none'; sh.style.transform = 'translateY(' + dy + 'px)'; }
    }, { passive: true });
    sh.addEventListener('touchend', function () {
      if (y0 == null) return;
      sh.style.transition = ''; sh.style.transform = '';
      if (dy > 110) closeSheet();
      y0 = null;
    });
  })();

  /* ================= 시작 ================= */
  renderHome();
  var cached = load('fc_state');
  // 이 기기에 남은 지난 화면은 같은 계정일 때만 먼저 보여줌 (다른 계정 내용이 잠깐이라도 보이면 안 됨)
  var who = window.FC_AUTH ? window.FC_AUTH.email() : '';
  if (cached && cached.items && cached.meta && (!window.FC_AUTH || (who && cached.email && cached.email.toLowerCase() === who.toLowerCase()))) { S = cached; lastGood = JSON.stringify(cached); renderAll(); chip(); }
  enqueue({ type: 'load' });
  (function () {   // 구글 권한 허용하고 돌아온 직후면 서버 업데이트 이어서
    var p = window.FC_AUTH && window.FC_AUTH.resumeUpdate && window.FC_AUTH.resumeUpdate();
    if (p) { updating = true; updAsked = true; toast('업데이트하는 중… (10초쯤)', { ms: 30000 }); p.then(updDone, updFail); }
  })();
})();
</script>
<script>
(function () {
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var evt = window.__bip || null, done = false, installed = false;
  var B = function (t) { return '<b style="display:inline">' + t + '</b>'; };
  function sync() {
    var login = document.getElementById('fcLogin');
    document.getElementById('inst').classList.toggle('on', !standalone && !done && login.classList.contains('on'));
  }
  function say(t) { document.getElementById('instText').innerHTML = t; document.getElementById('instBtn').hidden = true; }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); evt = e; installed = false; sync(); });
  window.addEventListener('appinstalled', function () { done = true; sync(); });
  new MutationObserver(sync).observe(document.getElementById('fcLogin'), { attributes: true });
  if (navigator.getInstalledRelatedApps) navigator.getInstalledRelatedApps().then(function (a) { if (a && a.length) installed = true; }).catch(function () {});
  document.getElementById('instBtn').onclick = function () {
    evt = evt || window.__bip;
    if (evt) { var e = evt; evt = window.__bip = null; e.prompt(); e.userChoice.then(function (c) { if (c.outcome === 'accepted') { done = true; sync(); } }); return; }
    if (installed) { say('<b>이미 설치돼 있어요</b>홈 화면(앱스 화면)의 ' + B('승훈스 고정비앱 V1') + ' 아이콘으로 여세요'); return; }
    var ua = navigator.userAgent, how;
    if (/KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line[/]|DaumApps|everytimeApp/i.test(ua))
      how = '여기(앱 안 브라우저)에선 설치가 안 돼요. 메뉴 → ' + B('다른 브라우저로 열기') + ' → 크롬이나 삼성 인터넷에서 다시 눌러주세요';
    else if (/SamsungBrowser/i.test(ua)) how = '오른쪽 아래 ' + B('≡ 메뉴') + ' → ' + B('현재 페이지 추가') + ' → ' + B('홈 화면');
    else if (/iPhone|iPad/i.test(ua)) how = '아래 가운데 ' + B('공유 버튼(□↑)') + ' → ' + B('홈 화면에 추가');
    else if (/Android/i.test(ua)) how = '오른쪽 위 ' + B('⋮') + ' → ' + B('홈 화면에 추가') + ' → ' + B('설치');
    else how = '주소창 오른쪽 끝 ' + B('설치 아이콘(화면+↓)') + ' → 설치';
    say('<b>이렇게 설치해요</b>' + how);
  };
  sync();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
